name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [codex/dns-adapter-coverage]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/darwin-audit-commands.yml
      - .github/workflows/windows-audit-storage.yml
      - cmd/accessweaver/managed_audit_commands_windows_test.go
      - cmd/accessweaver/managed_audit_ordinary_windows_test.go
      - internal/uiaccess/access_windows.go
      - scripts/test-darwin-audit-commands.sh
      - scripts/test_darwin_audit_command_capture.py
      - scripts/core-test-evidence.cjs
      - scripts/core-test-evidence.test.cjs
      - scripts/core-test-catalog/**
      - scripts/build-all.sh
      - scripts/package-release.sh
      - scripts/release_archive.py
      - scripts/verify_release.py
      - scripts/verify-release.py
      - scripts/verify_release_provenance.py
      - scripts/verify_release_rebuild.py
      - scripts/publish_prerelease.py
      - scripts/signed_release_manifest.py
      - scripts/macos_installer.py
      - scripts/sbom.py
      - scripts/test_signed_release_manifest.py
      - scripts/verify-windows-installer-publisher.ps1
      - scripts/build-windows-installer.ps1
      - scripts/sign-windows-installer-artifact.ps1
      - scripts/windows-installer.iss
      - scripts/verify_macos_installer_publisher.py
      - scripts/build-macos-deployment.py
      - scripts/test_macos_installer_publisher.py
      - scripts/windows-installer-common.ps1
      - scripts/test-windows-installer-contracts.ps1
      - scripts/check-vulnerabilities.sh
      - scripts/check-vulnerability-report.py
      - scripts/browser-tests/core-fixture.test.cjs

permissions:
  contents: read

concurrency:
  # A preview can only validate its own commit. Releases that can publish
  # share a tag-scoped lock through package verification and promotion.
  group: release-${{ github.ref_type == 'tag' && github.ref || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: false
  queue: max

env:
  GO_VERSION: '1.27.4'

jobs:
  parser-mutations:
    uses: ./.github/workflows/parser-fuzz.yml
    with:
      skip_browser: true

  browser:
    uses: ./.github/workflows/browser.yml
  windows-audit-storage:
    uses: ./.github/workflows/windows-audit-storage.yml
  darwin-audit-commands:
    uses: ./.github/workflows/darwin-audit-commands.yml
  vulnerabilities:
    name: Go vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOBIN: ${{ github.workspace }}/build/security-tools-bin
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify pinned scanner and workflow validator
        run: |
          go -C scripts/security-tools mod download
          go -C scripts/security-tools mod verify
          go -C scripts/security-tools install golang.org/x/vuln/cmd/govulncheck
          go -C scripts/security-tools install github.com/rhysd/actionlint/cmd/actionlint
          # actionlint 1.7.12 predates the documented concurrency.queue key.
          "$GOBIN/actionlint" -shellcheck= -pyflakes= -ignore '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
          python3 -m unittest discover -s scripts -p test_vulnerability_report.py -v
          python3 -m unittest discover -s scripts -p test_darwin_audit_command_capture.py -v
          python3 -m unittest discover -s scripts -p test_signed_release_manifest.py -v
      - name: Verify optional fixture dependencies and compile (no guest execution)
        run: |
          go -C scripts/fixtures/wgpeer mod download
          go -C scripts/fixtures/wgpeer mod verify
          go -C scripts/fixtures/wgpeer test ./... -count=1
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wgpeer.exe" .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/probe.exe" ./cmd/probe
      - name: Build fixture SBOMs and validate pinned CycloneDX schemas
        run: |
          go -C scripts/sbom-tools mod download
          go -C scripts/sbom-tools mod verify
          go -C scripts/sbom-tools test ./... -count=1
          go -C scripts/sbom-tools build -mod=readonly -trimpath -o "$RUNNER_TEMP/sbom-schema" .
          mkdir -p build/sbom-checks
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/wgpeer.exe" --module-root scripts/fixtures/wgpeer --main . --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/wgpeer.cdx.json
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/probe.exe" --module-root scripts/fixtures/wgpeer --main ./cmd/probe --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/probe.cdx.json
          "$RUNNER_TEMP/sbom-schema" --schemas scripts/sbom/schema build/sbom-checks/wgpeer.cdx.json build/sbom-checks/probe.cdx.json
      - name: Retain fixture SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-sbom-check
          path: build/sbom-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check known vulnerabilities for all core targets and fixture environments
        run: GOVULNCHECK="$GOBIN/govulncheck" bash scripts/check-vulnerabilities.sh
      - name: Retain fixed vulnerability matrix outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-vulnerability-matrix-status
          path: build/security-checks/matrix-status.tsv
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain scanner evidence, including failed reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-vulnerability-reports
          path: build/security-checks/
          if-no-files-found: ignore
          retention-days: 14
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            sdkarch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            sdkarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            sdkarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            sdkarch: x64
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: ${{ matrix.goos }}
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Check native identity rejection cases
        run: |
          node --test scripts/check-native-environment.test.cjs scripts/check-packaged-evidence.test.cjs scripts/check-profile-benchmark.test.cjs
          node --check scripts/test-packaged-diagnostics.cjs
      - name: Verify Windows managed update staging
        if: runner.os == 'Windows'
        run: python -m unittest discover -s scripts -p test_signed_release_manifest.py -k test_windows_staging_ -v
      - run: go vet ./...
      - name: Unit tests
        if: runner.os != 'macOS'
        run: go test ./... -count=1
      - name: macOS unit tests with source-bound outcomes
        if: runner.os == 'macOS'
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: node scripts/core-test-evidence.cjs unit
      - name: Retain fixed macOS unit-test outcomes
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-darwin-unit-status-${{ matrix.goarch }}
          path: build/native-core-evidence/status.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Race native macOS engine lifecycle
        if: runner.os == 'macOS'
        run: go test -race ./internal/engine ./cmd/accessweaver -count=1
      - name: Native macOS engine lifecycle without CGO
        if: runner.os == 'macOS'
        shell: bash
        run: CGO_ENABLED=0 go test ./internal/engine ./cmd/accessweaver -count=1
      - name: Race macOS paired policy and audit storage
        if: runner.os == 'macOS'
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: go test -race ./internal/managed ./internal/audit -run '^TestDarwin' -count=1
      - name: Native macOS trust and paired storage without CGO
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: CGO_ENABLED=0 go test ./internal/darwintrust ./internal/managed ./internal/audit -run '^TestDarwin' -count=1 -v
      - name: Disposable macOS cross-user session ACL regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_SESSION_TEST: '1'
        run: bash scripts/test-darwin-session.sh
      - name: Retain macOS session ACL evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-session-acl-check-${{ matrix.goarch }}
          path: build/darwin-session-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain macOS trust preflight
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-trust-preflight-${{ matrix.goarch }}
          path: build/darwin-trust-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fuzz private workflow metadata encoding
        if: runner.os == 'Linux'
        run: go test ./internal/workflow -run '^$' -fuzz '^FuzzWorkflowMetadataOutput$' -fuzztime=20s -parallel=2
      - name: Fuzz canonical audit event and checkpoint decoding
        if: runner.os == 'Linux'
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzCanonicalAuditDecoders$' -fuzztime=10s -parallel=2
      - name: Measure native concurrent profile inventory
        run: node scripts/check-profile-benchmark.cjs
      - name: Retain source-bound profile benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-benchmark-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/profile-benchmarks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify executed native CLI identity
        run: |
          go build ./cmd/accessweaver
          node scripts/check-native-environment.cjs --binary ./accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Retain native platform identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-identity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/native-checks/
          if-no-files-found: ignore
          retention-days: 14
      - if: runner.os != 'Windows'
        run: |
          go build ./cmd/accessweaver
          python3 scripts/test-unix-controller.py ./accessweaver
      - if: runner.os == 'Linux'
        run: bash scripts/test-linux-session.sh ./accessweaver
      - if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          node --check web/system.js
          node --check web/locales.js
      - name: Native signed recovery interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-recovery-interop.cjs
      - name: Retain recovery interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-interop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/managed-policy-checks/recovery-interop-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Native encrypted backup interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-backup-interop.cjs
      - name: Retain native backup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-check-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/backup-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Portable archive metadata regression checks
        run: |
          python3 scripts/check_readiness_evidence.py
          python3 -m unittest discover -s scripts -p test_readiness_evidence.py -v
          python3 -m unittest discover -s scripts -p test_release_archive.py -v
          python3 -m unittest discover -s scripts -p test_release_provenance.py -v
          python3 -m unittest discover -s scripts -p test_macos_installer_publisher.py -v
          python3 -m unittest discover -s scripts -p test_publish_prerelease.py -v
          python3 -m unittest discover -s scripts -p test_release_rebuild.py -v
          python3 -m unittest discover -s scripts -p test_stage_packaged_native.py -v
          python3 -m unittest discover -s scripts -p test_windows_handle_census.py -v
          python3 -m unittest discover -s scripts -p test_packaged_windows_discovery.py -v
          python3 -m unittest discover -s scripts -p test_sbom.py -v
          python3 -m unittest discover -s scripts -p test_darwin_storage.py -v
          python3 -m unittest discover -s scripts -p test_bsd_guest.py -v
          python3 -m unittest discover -s scripts -p test_openbsd_guest.py -v
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-workflow.ps1
      - name: Compile unsigned Windows installer (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-installer.ps1 -ExpectedCompilerVersion '6.7.1' -TargetArch '${{ matrix.goarch }}'
      - name: Retain Windows installer compilation evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-compile-check-${{ matrix.goarch }}
          path: |
            build/installer-checks/
            build/accessweaver-*-windows-${{ matrix.goarch }}-setup.exe
            build/accessweaver-*-windows-${{ matrix.goarch }}-setup.exe.cdx.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable macOS managed-policy acceptance
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_POLICY_TEST: '1'
        run: bash scripts/test-darwin-managed-policy.sh
      - name: Retain macOS managed-policy acceptance evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable macOS APFS exhaustion acceptance
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_STORAGE_TEST: '1'
        run: python3 scripts/test-darwin-storage.py
      - name: Retain macOS APFS exhaustion evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-storage-fault-check-${{ matrix.goarch }}
          path: build/darwin-storage-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Linux managed-policy acceptance
        if: runner.os == 'Linux'
        env:
          ACCESSWEAVER_DISPOSABLE_LINUX_POLICY_TEST: '1'
        run: bash scripts/test-linux-managed-policy.sh
      - name: Retain Linux managed-policy acceptance evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Windows managed-policy acceptance
        if: runner.os == 'Windows'
        shell: powershell
        env:
          ACCESSWEAVER_DISPOSABLE_POLICY_TEST: '1'
        run: |
          go test ./cmd/accessweaver -run '^TestDisposableManagedPolicyNative$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/managed -run '^TestDisposablePolicyTransactionRollback$' -count=1 -v
      - name: Retain managed-policy acceptance evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser logic and fixture cleanup tests
        run: node --test scripts/core-test-evidence.test.cjs web/app.test.cjs scripts/browser-tests/core-fixture.test.cjs scripts/browser-tests/desktop-performance.test.cjs scripts/browser-tests/browser-native-binary.test.cjs scripts/browser-tests/browser-resources.test.cjs scripts/browser-tests/browser-memory.test.cjs scripts/browser-tests/job-cpu.test.cjs scripts/browser-tests/accessibility-report.test.cjs
  package:
    name: Package core and attest build provenance
    outputs:
      directory: ${{ steps.build_portable.outputs.directory }}
      label: ${{ steps.build_portable.outputs.label }}
      artifact_id: ${{ steps.upload_portable.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [verify, vulnerabilities, browser, windows-audit-storage, darwin-audit-commands, parser-mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build and package
        id: build_portable
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          label="preview-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            label="$GITHUB_REF_NAME"
            export BUILD_VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/package-release.sh "$label"
          python3 scripts/verify-release.py "dist/$label" --check-go-metadata --execute-native
          cp "dist/$label/SHA256SUMS.txt" "$RUNNER_TEMP/first-package-checksums.txt"
          bash scripts/package-release.sh "$label"
          python3 scripts/verify-release.py "dist/$label" --check-go-metadata --execute-native
          cmp "$RUNNER_TEMP/first-package-checksums.txt" "dist/$label/SHA256SUMS.txt"
          echo "directory=dist/$label" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
      - name: Attest every archive, manifest and checksum file
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build_portable.outputs.directory }}/*
          create-storage-record: false
      - name: Retain and verify the signed provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ steps.build_portable.outputs.directory }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" "$PACKAGE_DIRECTORY/BUILD-PROVENANCE.sigstore.json"
          mkdir -p build/provenance-checks
          gh version > build/provenance-checks/gh-version.txt
          python3 scripts/verify_release_provenance.py "$PACKAGE_DIRECTORY" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" > build/provenance-checks/verified-subjects.txt
          python3 scripts/check_provenance_rejections.py "$PACKAGE_DIRECTORY" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" > build/provenance-checks/rejections.json
      - name: Retain provenance verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-provenance-check
          path: build/provenance-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload archives and checksums
        id: upload_portable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: accessweaver-unsigned-${{ github.run_attempt }}
          path: ${{ steps.build_portable.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  hosted-rebuild:
    name: Compare a fresh hosted rebuild
    needs: package
    outputs:
      reference_checksums_sha256: ${{ steps.compare.outputs.reference_checksums_sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build from the same clean source with fresh caches
        shell: bash
        env:
          GOTOOLCHAIN: local
          PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          export GOCACHE="$(mktemp -d "$RUNNER_TEMP/accessweaver-build-cache.XXXXXXXX")"
          export GOMODCACHE="$(mktemp -d "$RUNNER_TEMP/accessweaver-module-cache.XXXXXXXX")"
          label="${PACKAGE_DIRECTORY#dist/}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export BUILD_VERSION="${GITHUB_REF_NAME#v}"; fi
          bash scripts/package-release.sh "$label"
          python3 scripts/verify-release.py "$PACKAGE_DIRECTORY" --check-go-metadata
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id || '0' }}
          path: build/rebuild-reference/${{ needs.package.outputs.label }}
      - name: Authenticate reference and compare all unsigned subjects
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
        run: |
          mkdir -p build/rebuild-evidence
          reference="build/rebuild-reference/${PACKAGE_DIRECTORY#dist/}"
          python3 scripts/verify_release_rebuild.py "$reference" "$PACKAGE_DIRECTORY" \
            --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" --report build/rebuild-evidence/comparison.json
          digest="$(python3 -c 'import json; print(json.load(open("build/rebuild-evidence/comparison.json"))["referenceChecksumsSha256"])')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "reference_checksums_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain the comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-hosted-rebuild-comparison
          path: build/rebuild-evidence/comparison.json
          if-no-files-found: ignore
          retention-days: 14
  packaged-native:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Packaged native (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            sdkarch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            sdkarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            sdkarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            sdkarch: x64
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: ${{ matrix.goos }}
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
      PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id || '0' }}
          path: build/release-candidate/${{ needs.package.outputs.label }}
      - name: Authenticate snapshot and stage native candidate (no execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stage_packaged_native.py --download-root build/release-candidate --into build/packaged-native
      - name: Execute candidate and compare authenticated build identity
        run: |
          node scripts/check-native-environment.cjs --binary ./build/packaged-native/accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
          node scripts/check-packaged-evidence.cjs identity build/packaged-native
      - name: Packaged backup and recovery interoperability
        run: |
          node scripts/test-backup-interop.cjs ./build/packaged-native/accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
          node scripts/test-recovery-interop.cjs ./build/packaged-native/accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Packaged loopback diagnostics
        run: node scripts/test-packaged-diagnostics.cjs ./build/packaged-native/accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Packaged Windows read-only discovery
        if: runner.os == 'Windows'
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_DISCOVERY_TEST: '1'
        run: python3 scripts/packaged_windows_discovery.py build/packaged-native
      - name: Packaged Unix controller ownership and shutdown
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-controller.py ./build/packaged-native/accessweaver --report build/packaged-native-checks/controller.json
      - name: Packaged Linux cross-user session isolation
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-session.sh ./build/packaged-native/accessweaver
      - name: Bind all results to the authenticated candidate
        run: node scripts/check-packaged-evidence.cjs complete build/packaged-native
      - name: Collect successful candidate and execution evidence
        shell: bash
        run: |
          mkdir build/release-qualified
          cp build/packaged-native/candidate.json build/release-qualified/candidate.json
          cp build/packaged-native-checks/acceptance.json build/release-qualified/execution.json
      - name: Attest the staging and successful execution files
        id: qualification_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-qualified/*.json
          create-storage-record: false
      - name: Retain the qualification attestation bundle
        shell: bash
        env:
          QUALIFICATION_BUNDLE: ${{ steps.qualification_provenance.outputs.bundle-path }}
        run: cp "$QUALIFICATION_BUNDLE" build/release-qualified/qualification.sigstore.json
      - name: Retain successful packaged target evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualified-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/release-qualified/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retain public candidate acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-native-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            build/packaged-native/candidate.json
            build/native-checks/
            build/backup-checks/
            build/managed-policy-checks/recovery-interop-*.json
            build/packaged-native-checks/
          if-no-files-found: ignore
          retention-days: 14
  packaged-freebsd:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Packaged guest (freebsd/${{ matrix.arch }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            sdkarch: x64
            packages: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            sdkarch: arm64
            packages: qemu-system-arm qemu-efi-aarch64=2024.02-2ubuntu0.10
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: ${{ matrix.sdkarch }}
          cache: false
      - name: Check candidate staging and guest isolation regressions
        run: |
          python3 -m unittest discover -s scripts -p test_stage_packaged_native.py -v
          python3 -m unittest discover -s scripts -p test_bsd_guest.py -v
          python3 -m unittest discover -s scripts -p test_openbsd_guest.py -v
      - name: Install distribution-signed hypervisor and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${{ matrix.packages }} qemu-utils xorriso openssh-client
      - name: Install hash-locked read-only postmortem tools
        run: >-
          python3 -m pip install --disable-pip-version-check --only-binary=:all:
          --platform any --implementation py --abi none --require-hashes
          --target build/bsd-inspection-tools -r scripts/requirements-bsd-inspection.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id || '0' }}
          path: build/release-candidate/${{ needs.package.outputs.label }}
      - name: Authenticate snapshot and stage archived FreeBSD candidate (no execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/stage_packaged_native.py --freebsd-guest --target freebsd/${{ matrix.arch }}
          --download-root build/release-candidate --into build/packaged-bsd
      - name: Execute archived candidate and core regressions inside the pinned guest
        env:
          ACCESSWEAVER_DISPOSABLE_BSD_GUEST_TEST: '1'
          ACCESSWEAVER_BSD_ARCH: ${{ matrix.arch }}
