      - name: Collect successful candidate and execution evidence
        shell: bash
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          mkdir build/release-qualified
          cp build/packaged-bsd/candidate.json build/release-qualified/candidate.json
          cp "build/bsd-native-checks/freebsd-$TARGET_ARCH.json" build/release-qualified/execution.json
      - name: Attest the staging and successful execution files
        id: qualification_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/release-qualified/*.json
          create-storage-record: false
      - name: Retain the qualification attestation bundle
        shell: bash
        env:
          QUALIFICATION_BUNDLE: ${{ steps.qualification_provenance.outputs.bundle-path }}
        run: cp "$QUALIFICATION_BUNDLE" build/release-qualified/qualification.sigstore.json
      - name: Retain successful packaged target evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualified-freebsd-${{ matrix.arch }}
          path: build/release-qualified/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Retain public archived-candidate execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-freebsd-${{ matrix.arch }}
          path: |
            build/packaged-bsd/candidate.json
            build/bsd-native-checks/
          if-no-files-found: ignore
          retention-days: 14
