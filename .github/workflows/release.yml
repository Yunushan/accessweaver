  verify-publication:
    name: Verify publication inputs
    outputs:
      qualification_sha256: ${{ steps.verify.outputs.qualification_sha256 }}
    needs: [package, hosted-rebuild, packaged-native, packaged-freebsd, packaged-openbsd]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id || '0' }}
          path: release-assets/${{ needs.package.outputs.label }}
      - name: Download successful packaged target receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-qualified-*
          path: release-qualification
      - name: Verify prerelease candidate
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
          REBUILD_CHECKSUMS_SHA256: ${{ needs.hosted-rebuild.outputs.reference_checksums_sha256 }}
        run: |
          verified_directory="release-assets/${PACKAGE_DIRECTORY#dist/}"
          mkdir -p build/release-publication
          python3 scripts/publish_prerelease.py "$verified_directory" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --rebuild-checksums-sha256 "$REBUILD_CHECKSUMS_SHA256" --native-qualification release-qualification --workflow-run-id "$GITHUB_RUN_ID" --verify-only \
            > build/release-publication/verified.json
          digest="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["qualificationSHA256"])' < build/release-publication/verified.json)"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "qualification_sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Retain the publication verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-publication-verification-${{ github.run_attempt }}
          path: build/release-publication/verified.json
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Publish prerelease assets
    needs: [package, hosted-rebuild, verify-publication]
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id || '0' }}
          path: release-assets/${{ needs.package.outputs.label }}
      - name: Download successful packaged target receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-qualified-*
          path: release-qualification
      - name: Verify and publish prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: ${{ needs.package.outputs.directory }}
          REBUILD_CHECKSUMS_SHA256: ${{ needs.hosted-rebuild.outputs.reference_checksums_sha256 }}
          EXPECTED_QUALIFICATION_SHA256: ${{ needs.verify-publication.outputs.qualification_sha256 }}
        run: |
          verified_directory="release-assets/${PACKAGE_DIRECTORY#dist/}"
          python3 scripts/publish_prerelease.py "$verified_directory" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
            --rebuild-checksums-sha256 "$REBUILD_CHECKSUMS_SHA256" --native-qualification release-qualification \
            --expected-qualification-sha256 "$EXPECTED_QUALIFICATION_SHA256" --workflow-run-id "$GITHUB_RUN_ID"
