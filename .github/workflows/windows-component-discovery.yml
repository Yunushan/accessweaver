name: Windows component discovery contracts

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'internal/workflow/windows.ps1'
      - 'scripts/test-windows-workflow.ps1'
      - '.github/workflows/windows-component-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Component discovery source (windows/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: windows-latest, nodearch: x64}
          - {arch: arm64, os: windows-11-arm, nodearch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.nodearch }}
          package-manager-cache: false
      - name: Run bounded inert component contracts
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'Hosted Windows fixture required'}
          $actualArch=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if(($env:EXPECTED_ARCH -ceq 'amd64' -and $actualArch -cne 'x64') -or ($env:EXPECTED_ARCH -ceq 'arm64' -and $actualArch -cne 'arm64')){throw 'Native architecture mismatch'}
          if((node --version) -cne 'v26.8.2'){throw 'Node identity mismatch'}
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $evidence=Join-Path $env:RUNNER_TEMP ('accessweaver-component-source-'+[Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $evidence -ErrorAction Stop)
          "ACCESSWEAVER_COMPONENT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $expected=@('PASS zapret selects only its expected executable in the preferred folder','PASS zapret refuses a preferred folder containing only the other executable','PASS zapret2 selects only its expected executable in the preferred folder','PASS zapret2 refuses a preferred folder containing only the other executable','PASS Scan rejects scan-incomplete before saving or installation','PASS Scan rejects scan-missing before saving or installation','PASS Scan rejects parser-incomplete before installation','PASS Scan rejects parser-missing before installation','PASS Complete complete scan reaches only the mocked installer','PASS Complete complete-default scan reaches only the mocked installer','PASS Complete complete-multi scan reaches only the mocked installer','PASS Single-target scan does not require a common section','PASS Multi-target complete-default scan requires a common section','PASS Multi-target complete-multi scan requires a common section','PASS App launch ignores matching processes in another session','PASS App launch ignores another executable in the current session','PASS App launch accepts the matching executable in the current session','PASS Application removal stops on a matching process failure and records an external effect','PASS Application process exit race remains a recorded external effect','PASS Application process stop records an external effect','PASS PTB clean download failure preserves the existing client','PASS PTB clean stages the replacement before removing the existing client','PASS PTB clean removal failure prevents installer execution','PASS Discord installer rejects other publisher categories','PASS Microsoft installer rejects other publisher categories','PASS WireSock installer requires its own publisher category','PASS Dedicated component download contracts pass in an isolated stock shell','PASS Custom WireSock installer without a hash is rejected before discovery','PASS Hashed custom WireSock request reaches mocked discovery','PASS Default WireSock request reaches mocked discovery','PASS Discord discovery selects the highest version before modification time','PASS Discord discovery retains nonstandard directory fallback after valid versions','PASS Discord application lookup uses the highest discovered version','PASS Component download fixture entered','PASS Component download source parsed','PASS Component download first five definitions loaded','PASS Component download first ten definitions loaded','PASS Component download first fifteen definitions loaded','PASS Component download first twenty definitions loaded','PASS Component download first twenty-five definitions loaded','PASS Component download definitions fixture completed','PASS Component download stream fixture completed','PASS Component download composition fixture completed','PASS Component download metadata fixture completed','PASS Component redirect policy fixture completed','PASS Component .NET redirect fixture completed','PASS Component curl owner fixture completed','PASS Component curl redirect fixture completed')
          $milestoneNames=@{
            vendor='PASS Vendor failure detail excludes ordinary non-error output'
            service='PASS Native service and driver enumeration succeeds with an explicit array result'
            arguments='PASS Native processes receive literal Windows arguments without shell evaluation'
            child='PASS Exited installer does not wait for a GUI child holding inherited output pipes'
            archive='PASS Independent archive fixture generation succeeds without vendor execution'
            main='Windows workflow contract tests completed. Test artifacts are under build/.'
            dns='PASS Dedicated DNS recovery contracts pass in an isolated stock shell'
            staging='PASS Component metadata cannot select the staging filename or escape its directory'
          }
          $milestones=@{};foreach($key in $milestoneNames.Keys){$milestones[$key]=$false}
          $suite=$false;$seen=@();$status='failed'
          try {
            $lines=@(& $stock -NoProfile -NonInteractive -File ./scripts/test-windows-workflow.ps1 2>$null)
            $suite=($LASTEXITCODE -eq 0)
            foreach($key in $milestoneNames.Keys){$milestones[$key]=(@($lines | Where-Object {$_ -ceq $milestoneNames[$key]}).Count -ge 1)}
            foreach($name in $expected){$seen+=@{name=$name.Substring(5);passed=(@($lines | Where-Object {$_ -ceq $name}).Count -eq 1)}}
            if($suite -and @($seen | Where-Object {-not $_.passed}).Count -eq 0){$status='passed'}
          } finally {
            $sources=@{};foreach($file in @('internal/workflow/windows.ps1','scripts/test-windows-workflow.ps1','scripts/test-windows-component-downloads.ps1','.github/workflows/windows-component-discovery.yml')){$sources[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()}
            $report=@{schemaVersion=1;sourceCommit=$env:GITHUB_SHA;architecture=$env:EXPECTED_ARCH;outcome=$status;suitePassed=$suite;cases=@($seen);milestones=$milestones;sourceSHA256=$sources;realVendorExecuted=$false;productionQualificationComplete=$false}
            [IO.File]::WriteAllText((Join-Path $evidence 'status.json'),($report|ConvertTo-Json -Depth 5 -Compress),[Text.UTF8Encoding]::new($false))
          }
          if($status -cne 'passed'){throw 'Component source contracts failed; fixed report retained'}
      - name: Retain fixed component source report
        if: always() && env.ACCESSWEAVER_COMPONENT_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-component-source-${{ matrix.arch }}
          path: ${{ env.ACCESSWEAVER_COMPONENT_EVIDENCE }}/status.json
          if-no-files-found: error
          retention-days: 7
