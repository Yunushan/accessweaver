name: Windows component discovery contracts

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'internal/workflow/windows.ps1'
      - 'scripts/test-windows-workflow.ps1'
      - 'scripts/test-windows-apps.ps1'
      - 'scripts/test-windows-app-evidence.ps1'
      - 'scripts/test-windows-drover-restore.ps1'
      - '.github/workflows/windows-component-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Component discovery source (windows/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: windows-latest, nodearch: x64}
          - {arch: arm64, os: windows-11-arm, nodearch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.nodearch }}
          package-manager-cache: false
      - name: Verify interactive application evidence predicates
        shell: pwsh
        run: ./scripts/test-windows-app-evidence.ps1
      - name: Verify Drover restoration and retry
        shell: pwsh
        run: ./scripts/test-windows-drover-restore.ps1
      - name: Verify application evidence and Drover recovery in stock Windows PowerShell
        shell: powershell
        run: |
          ./scripts/test-windows-app-evidence.ps1
          ./scripts/test-windows-drover-restore.ps1
      - name: Run bounded inert component contracts
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'Hosted Windows fixture required'}
          $actualArch=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if(($env:EXPECTED_ARCH -ceq 'amd64' -and $actualArch -cne 'x64') -or ($env:EXPECTED_ARCH -ceq 'arm64' -and $actualArch -cne 'arm64')){throw 'Native architecture mismatch'}
          if((node --version) -cne 'v26.8.2'){throw 'Node identity mismatch'}
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $evidence=Join-Path $env:RUNNER_TEMP ('accessweaver-component-source-'+[Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $evidence -ErrorAction Stop)
          "ACCESSWEAVER_COMPONENT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $expected=@('PASS zapret selects only its expected executable in the preferred folder','PASS zapret refuses a preferred folder containing only the other executable','PASS zapret2 selects only its expected executable in the preferred folder','PASS zapret2 refuses a preferred folder containing only the other executable','PASS Scan rejects scan-incomplete before saving or installation','PASS Scan rejects scan-missing before saving or installation','PASS Scan rejects parser-incomplete before installation','PASS Scan rejects parser-missing before installation','PASS Complete complete scan reaches only the mocked installer','PASS Complete complete-default scan reaches only the mocked installer','PASS Complete complete-multi scan reaches only the mocked installer','PASS Single-target scan does not require a common section','PASS Multi-target complete-default scan requires a common section','PASS Multi-target complete-multi scan requires a common section','PASS Scan rejects scan-lua-changed before saving or installation','PASS Scan rejects parser-lua-init before installation','PASS A changed source Lua library is refused before component staging','PASS Service uses both validated Lua libraries in upstream order','PASS A changed staged Lua library is refused before service creation','PASS Manual install preserves an explicitly supplied Lua initializer','PASS App launch ignores unrelated names, paths and sessions','PASS Application launch refuses when process inventory fails','PASS Application launch refuses changed discovery before handoff','PASS Application launch refuses changed discovery after handoff','PASS Application launch releases its executable after failed handoff','PASS Application launch releases its executable after process verification','PASS Application launch refuses an unresolved matching process before journaling or handoff','PASS App launch accepts the matching executable in the current session','PASS Application removal leaves processes running when the uninstaller is missing','PASS Application removal leaves processes running when uninstallers are ambiguous','PASS Application removal refuses a matching client in another session before stopping any process','PASS Application removal refuses an unverified matching session before stopping any process','PASS Application removal preserves processes when a plausible executable cannot be verified','PASS Application removal stops on a matching process failure and records an external effect','PASS Application process exit race remains a recorded external effect','PASS Application removal refuses an unconfirmed process exit','PASS Application process stop records an external effect','PASS Application removal readback requires the previous executable to be absent','PASS Application removal refuses client-restarted changes before vendor launch','PASS Application removal refuses client-now-unreadable changes before vendor launch','PASS Application removal refuses replacement installation observed after process readback','PASS Application removal refuses original installation observed after process readback','PASS Application removal refuses a surviving process in any session','PASS Application removal refuses an unreadable matching process exit state','PASS Application removal refuses an inaccessible possibly matching live process after uninstall','PASS Application removal accepts an exited hidden process and ignores an unrelated hidden image','PASS Application removal scopes shared helper names to the selected installation','PASS Application removal accepts exited matches and ignores unrelated processes','PASS Application removal records vendor side effects even without a process stop','PASS Application removal releases the uninstaller guard after vendor failure','PASS Native launch releases the verified file before waiting for the child','PASS A failed native launch releases the verified file','PASS Application removal confirms both executable and process readback before success','PASS Application removal identifies an already absent client without a vendor launch','PASS Application removal refuses absent discord while an updater remains','PASS Application removal confirms discord absence after updater exit','PASS Application removal refuses absent discord-ptb while an updater remains','PASS Application removal confirms discord-ptb absence after updater exit','PASS PTB clean refuses incomplete stable cleanup for appStableReturnsDuringCleanup','PASS PTB clean refuses incomplete stable cleanup for appStableProcessReturns','PASS Application removal refuses client changes before vendor launch','PASS Application removal refuses uninstaller changes before vendor launch','PASS Application removal refuses ambiguous changes before vendor launch','PASS Application journal starts with no vendor effect','PASS Application setup refuses to launch when its journal cannot be written','PASS User application staging holds its account lock and avoids machine storage','PASS Desktop application coordination uses the cross-session namespace','PASS Desktop application operation owns its Windows mutex','PASS Second application operation is refused without replacing the original owner','PASS Application workflow admission recovers after its owner releases the mutex','PASS PTB clean download failure leaves vendor effects clear and preserves the existing client','PASS PTB clean refuses stable client path changes during download before setup','PASS PTB clean refuses stable client bytes changes during download before setup','PASS PTB clean refuses stable client disappearance changes during download before setup','PASS PTB clean refuses stable client appearance changes during download before setup','PASS PTB clean verifies the installed replacement before removal and rechecks it after cleanup','PASS PTB clean preserves stable Discord when setup leaves the previous PTB executable unchanged','PASS PTB clean accepts verified new bytes at the existing PTB path','PASS PTB setup refuses an unreadable installed executable with clean mode False','PASS PTB setup refuses an unreadable installed executable with clean mode True','PASS Discord reinstall refuses changed replacement executable bytes at the same path','PASS PTB clean retains a read-only installer handle through installer launch','PASS PTB clean refuses a changed staged installer before any vendor effect','PASS PTB installer failure preserves stable Discord and retains setup uncertainty','PASS PTB readback failure preserves stable Discord and retains setup uncertainty','PASS PTB cleanup refuses a replacement stable client','PASS PTB cleanup preserves a newly observed stable client','PASS PTB clean reports removal failure after verifying the replacement','PASS Discord selects a native stable installer and retains the PTB x64 distribution','PASS Application setup distinguishes a newly observed installation from an existing one','PASS Discord refuses unknown architecture before download or client removal','PASS Discord reinstall requires an installed stable client before download','PASS Discord reinstall preserves a client updated during download','PASS Discord reinstall refuses changed installer bytes before removal','PASS Discord reinstall stops when removal fails','PASS Discord reinstall holds its verified installer through removal and launch','PASS Discord reinstall refuses reappearing stable client before setup','PASS Discord reinstall refuses unreadable replacement executable','PASS Discord reinstall refuses changed replacement executable path','PASS SplitCord selects the exact uploaded setup asset for the release tag','PASS SplitCord refuses duplicate pending and wrong-release setup assets','PASS SplitCord checks the release digest and retains explicit hash fallback','PASS Bundled Visual C runtime rejects a valid signature from another publisher category','PASS Bundled Visual C runtime accepts the expected publisher category before mocked launch','PASS amd64 bundle selects only its platform, uses system MSI and preserves reboot exit codes','PASS arm64 bundle selects only its platform, uses system MSI and preserves reboot exit codes','PASS Bundled prerequisite launches only its verified protected copy and retires it','PASS Bundled prerequisite retires its protected copy after signature refusal','PASS Visual C runtime reboot defers packet filter and ProxiFyre setup','PASS Packet filter reboot defers ProxiFyre setup','PASS ProxiFyre refuses a successful runtime install without registration','PASS ProxiFyre refuses a successful packet filter install without registration','PASS ProxiFyre continues when both prerequisite registrations are visible','PASS Standalone prerequisite reports pending reboot without claiming installation','PASS Standalone prerequisite refuses installer success without registration','PASS Standalone prerequisite reports installation after registration','PASS Managed prerequisite ignores implicit unapproved local bundles','PASS Unmanaged prerequisite can still use the implicit local bundle','PASS Managed strategy scan refuses an absent approved bundle before saving','PASS Managed strategy scan runs from the staged approved bundle','PASS Discord installer rejects other publisher categories','PASS Microsoft installer rejects other publisher categories','PASS WireSock installer requires its own publisher category','PASS Update discovery filters release metadata and returns the official tag link','PASS Update discovery preserves a no-compatible-release result','PASS Update discovery refuses a selected tag absent from admitted metadata','PASS Update discovery rejects invalid list shapes before comparison','PASS Update discovery requires architecture-specific uploaded assets with digests','PASS Update discovery refuses unsupported native architecture','PASS Update discovery rejects incomplete and invalid comparison results','PASS WireSock recognizes its exact native installer pin with a Windows-valid signature','PASS WireSock pin recognition refuses invalid signatures and unrelated pins and categories','PASS WireSock uninstall accepts a signed cached copy of its exact native installer','PASS WireSock uninstall refuses a different native pin or invalid signature before cleanup','PASS WireSock uninstall refuses ambiguous registrations before cleanup','PASS WireSock paired uninstall refuses mismatched cache or MSI identity before cleanup','PASS WireSock parses MSI command identity independently of Windows culture','PASS WireSock paired uninstall runs the bundle and waits for the hidden MSI','PASS WireSock MSI uninstall targets its registered product code','PASS WireSock MSI uninstall refuses mismatched or compound commands before cleanup','PASS WireSock uninstall waits for the registered package to disappear','PASS WireSock uninstall waits for remaining vendor services and secondary CLI paths','PASS WireSock uninstall refuses completion when service removal cannot be verified','PASS WireSock uninstall reports an ownership record that could not be retired','PASS WireSock uninstall reports restart without claiming verified removal','PASS Bundled WireSock rejects an unrelated publisher and retires the staged copy','PASS Bundled WireSock launches only the verified staged installer and retires it','PASS WireSock selects separate installer plans for native AMD64 and ARM64','PASS WireSock refuses an installer plan for an unknown architecture','PASS WireSock defers connection after an installer restart request','PASS WireSock checks for both services before starting either','PASS WireSock refuses transitional service state before starting either service','PASS WireSock starts only a stopped vendor service and records the external effect','PASS WireSock accepts the existing modern ownership record format','PASS WireSock accepts its recorded legacy CLI alongside a modern installation','PASS WireSock rejects invalid records before commands or task changes','PASS WireSock disconnect refuses while scheduled reconnect removal is unconfirmed','PASS WireSock disconnect retires scheduled reconnect and retains its profile','PASS WireSock retains the profile when reconnect task removal is unconfirmed','PASS WireSock distinguishes disconnect and deletion failures and retains ownership','PASS WireSock retires the reconnect task before disconnecting or deleting the profile','PASS WireSock preserves ownership for competing vendor inventory','PASS WireSock preserves ownership for remaining vendor inventory','PASS WireSock preserves ownership for partial-before vendor inventory','PASS WireSock preserves ownership for partial-after vendor inventory','PASS WireSock retry retires ownership for an already deleted vendor profile without disconnecting','PASS WireSock import-only recovery leaves the active connection alone','PASS WireSock recovery after a connection attempt retains both cleanup steps','PASS WireSock retires failed import staging before any vendor command','PASS WireSock import failure rolls back only the generated profile','PASS WireSock journal failure before connect preserves the active tunnel','PASS WireSock connect failure uses the persisted connection recovery phase','PASS WireSock records only a fixed vendor status and discards private output','PASS WireSock requires confirmed vendor status before publishing ownership','PASS WireSock retires import copies after completion and preserves the generated profile','PASS WireSock replaces plain and prefixed application rules in every peer','PASS WireSock retains other peer rules and the original configuration','PASS Dedicated component download contracts pass in an isolated stock shell','PASS Custom WireSock installer without a hash is rejected before discovery','PASS Hashed custom WireSock request reaches mocked discovery','PASS Default WireSock request reaches mocked discovery','PASS Discord discovery selects the highest version before modification time','PASS Discord discovery retains nonstandard directory fallback after valid versions','PASS Discord application lookup uses the highest discovered version','PASS Component download fixture entered','PASS Component download source parsed','PASS Component download first five definitions loaded','PASS Component download first ten definitions loaded','PASS Component download first fifteen definitions loaded','PASS Component download first twenty definitions loaded','PASS Component download first twenty-five definitions loaded','PASS Component download definitions fixture completed','PASS Component download stream fixture completed','PASS Component download composition fixture completed','PASS Component download metadata fixture completed','PASS Component redirect policy fixture completed','PASS Component .NET redirect fixture completed','PASS Component curl owner fixture completed','PASS Component curl redirect fixture completed','PASS SplitCord discovery uses the registered custom path from the alternate machine view','PASS SplitCord discovery deduplicates matching machine registrations','PASS SplitCord discovery refuses two different registered installations','PASS Confirmed exited process does not prevent app launch','PASS WireSock retains ownership when idle status output is incomplete','PASS WireSock can remove its profile after a failed disconnect and confirmed idle status','PASS WireSock recovery can delete its recorded profile after confirmed idle status','PASS WireSock recovery refuses deletion while the vendor is still disconnecting','PASS WireSock retains ownership after an unconfirmed disconnect process exit','PASS WireSock refuses a remaining managed profile or unverified inventory before import','PASS WireSock recovery refuses a journal for a different current owner','PASS WireSock recovery refuses competing vendor profiles before global disconnect','PASS WireSock recovery admits an absent vendor profile without a global disconnect','PASS WireSock rollback retains its owner when vendor deletion is unverified','PASS WireSock rollback resumes after vendor deletion and retires its recorded ownership file','PASS WireSock recovery accepts its unique journaled vendor profile','PASS WireSock import-only replay skips the global disconnect preflight','PASS WireSock ownerless rollback rechecks idle status at deletion','PASS WireSock ownerless rollback verifies named deletion without disconnecting','PASS WireSock recovery without an owner refuses a connected vendor','PASS WireSock recovery without an owner selects named deletion after confirmed idle status','PASS WireSock paired uninstall requires a valid hidden MSI product key without a command','PASS WireSock paired uninstall accepts a hidden MSI without an uninstall command','PASS WireSock cached engine requires a validated pair and a valid native signature and pin','PASS WireSock paired uninstall accepts its exact release-derived cached engine','PASS WireSock uninstall waits for a replacement vendor registration','PASS WireSock uninstall refuses completion when registry readback fails')
          $milestoneNames=@{
            vendor='PASS Vendor failure detail excludes ordinary non-error output'
            service='PASS Native service and driver enumeration succeeds with an explicit array result'
            arguments='PASS Native processes receive literal Windows arguments without shell evaluation'
            child='PASS Exited installer does not wait for a GUI child holding inherited output pipes'
            archive='PASS Independent archive fixture generation succeeds without vendor execution'
            main='Windows workflow contract tests completed. Test artifacts are under build/.'
            dns='PASS Dedicated DNS recovery contracts pass in an isolated stock shell'
            staging='PASS Component metadata cannot select the staging filename or escape its directory'
          }
          $milestones=@{};foreach($key in $milestoneNames.Keys){$milestones[$key]=$false}
          $suite=$false;$seen=@();$status='failed'
          try {
            $lines=@(& $stock -NoProfile -NonInteractive -File ./scripts/test-windows-workflow.ps1 2>$null)
            $suite=($LASTEXITCODE -eq 0)
            foreach($key in $milestoneNames.Keys){$milestones[$key]=(@($lines | Where-Object {$_ -ceq $milestoneNames[$key]}).Count -ge 1)}
            foreach($name in $expected){$seen+=@{name=$name.Substring(5);passed=(@($lines | Where-Object {$_ -ceq $name}).Count -eq 1)}}
            if($suite -and @($seen | Where-Object {-not $_.passed}).Count -eq 0){$status='passed'}
          } finally {
            $sources=@{};foreach($file in @('internal/workflow/windows.ps1','scripts/test-windows-workflow.ps1','scripts/test-windows-component-downloads.ps1','scripts/test-windows-vendor-preflight.ps1','scripts/test-windows-apps.ps1','scripts/test-windows-app-evidence.ps1','.github/workflows/windows-component-discovery.yml')){$sources[$file]=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()}
            $report=@{schemaVersion=1;sourceCommit=$env:GITHUB_SHA;architecture=$env:EXPECTED_ARCH;outcome=$status;suitePassed=$suite;cases=@($seen);milestones=$milestones;sourceSHA256=$sources;realVendorExecuted=$false;productionQualificationComplete=$false}
            [IO.File]::WriteAllText((Join-Path $evidence 'status.json'),($report|ConvertTo-Json -Depth 5 -Compress),[Text.UTF8Encoding]::new($false))
          }
          if($status -cne 'passed'){throw 'Component source contracts failed; fixed report retained'}
      - name: Retain fixed component source report
        if: always() && env.ACCESSWEAVER_COMPONENT_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-component-source-${{ matrix.arch }}
          path: ${{ env.ACCESSWEAVER_COMPONENT_EVIDENCE }}/status.json
          if-no-files-found: error
          retention-days: 7
