name: Desktop browser acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  browser:
    name: Real browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --user 1001 --init --shm-size=1gb
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check ordinary-user container paths
        timeout-minutes: 5
        shell: sh
        run: |
          set -eu
          if [ "$(id -u)" != 1001 ]; then
            printf '%s\n' 'Browser acceptance requires UID 1001.' >&2
            exit 1
          fi
          for directory in "${HOME:-}" "${GITHUB_WORKSPACE:-}" "${RUNNER_TEMP:-}" "${RUNNER_TOOL_CACHE:-}"; do
            if [ -z "$directory" ] || [ ! -d "$directory" ] || [ ! -w "$directory" ]; then
              printf 'Required browser container directory is missing or not writable: %s\n' "$directory" >&2
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          package-manager-cache: false
      - name: Build the real controller
        run: go build -trimpath -o build/browser-tests/accessweaver ./cmd/accessweaver
      - name: Install locked test dependencies and check known advisories
        working-directory: scripts/browser-tests
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Verify the pinned preinstalled browser environment
        timeout-minutes: 5
        working-directory: scripts/browser-tests
        run: node check-image-environment.cjs
      - name: Exercise the dashboard with an isolated local controller
        working-directory: scripts/browser-tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm test -- --project="$BROWSER"
      - name: Retain test results without private controller state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-browser-${{ matrix.browser }}
          path: build/browser-results/
          if-no-files-found: ignore
          retention-days: 14
