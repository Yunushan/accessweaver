name: Desktop browser acceptance

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/dns-adapter-coverage]
    paths:
      - web/app.js
      - web/app.css
      - scripts/browser-tests/desktop.spec.cjs
      - scripts/browser-tests/suite-contracts.json
      - .github/workflows/browser.yml

permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'

jobs:
  browser:
    name: Real browser (${{ matrix.goarch }}/${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      # Docker populates this isolated anonymous volume from the image's /etc.
      # Its machine-policy parent must use qualified persistent storage.
      volumes:
        - /etc
      options: --user 1001 --init --shm-size=1gb --cgroupns=private
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        goarch: [amd64, arm64]
        include:
          - goarch: amd64
            os: ubuntu-latest
            sdkarch: x64
            nodearch: x64
          - goarch: arm64
            os: ubuntu-24.04-arm
            sdkarch: arm64
            nodearch: arm64
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_JOB_CPU_ACCOUNTING: required
      ACCESSWEAVER_EXPECT_GOOS: linux
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - name: Check ordinary-user container paths
        timeout-minutes: 5
        shell: sh
        run: |
          set -eu
          if [ "$(id -u)" != 1001 ]; then
            printf '%s\n' 'Browser acceptance requires UID 1001.' >&2
            exit 1
          fi
          for directory in "${HOME:-}" "${GITHUB_WORKSPACE:-}" "${RUNNER_TEMP:-}" "${RUNNER_TOOL_CACHE:-}"; do
            if [ -z "$directory" ] || [ ! -d "$directory" ] || [ ! -w "$directory" ]; then
              printf 'Required browser container directory is missing or not writable: %s\n' "$directory" >&2
              exit 1
            fi
          done
          if [ ! -d /etc ] || [ -L /etc ] || [ "$(stat -c '%u' -- /etc)" != 0 ] || [ -w /etc ]; then
            printf '%s\n' 'Browser container /etc must be a real root-owned directory that UID 1001 cannot write.' >&2
            exit 1
          fi
          policy_filesystem="$(stat -f -c '%t' -- /etc)"
          case "$policy_filesystem" in
            ef53|58465342|9123683e) ;;
            *)
              printf 'Browser container /etc filesystem %s is unsupported; require ext4, XFS or Btrfs.\n' "$policy_filesystem" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.nodearch }}
          package-manager-cache: false
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Build the real controller
        run: go build -trimpath -o build/browser-tests/accessweaver ./cmd/accessweaver
      - name: Verify built controller native identity
        run: node scripts/check-native-environment.cjs --binary build/browser-tests/accessweaver
      - name: Install locked test dependencies and check known advisories
        working-directory: scripts/browser-tests
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
      - name: Verify the pinned preinstalled browser environment
        timeout-minutes: 5
        working-directory: scripts/browser-tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: node check-image-environment.cjs
      - name: Verify fixed keyboard evidence contracts
        run: node --test scripts/browser-tests/svg-geometry.test.cjs scripts/browser-tests/modal-keyboard.test.cjs scripts/browser-tests/suite-status-reporter.test.cjs scripts/browser-tests/desktop-performance.test.cjs scripts/browser-tests/browser-native-binary.test.cjs scripts/browser-tests/browser-resources.test.cjs scripts/browser-tests/browser-memory.test.cjs scripts/browser-tests/job-cpu.test.cjs scripts/check-native-environment.test.cjs
      - name: Verify isolated application contracts
        run: |
          unset ACCESSWEAVER_HISTORY_INTEROP ACCESSWEAVER_RECONCILIATION_INTEROP ACCESSWEAVER_CONTROLLER_STORAGE_INTEROP ACCESSWEAVER_SUPPORT_INTEROP
          node --test web/app.test.cjs
      - name: Exercise the dashboard with an isolated local controller
        working-directory: scripts/browser-tests
        env:
          BROWSER: ${{ matrix.browser }}
        run: npm test -- --project="$BROWSER"
      - name: Retain test results without private controller state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-browser-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/browser-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain fixed modal keyboard contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: modal-keyboard-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/modal-keyboard-evidence/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain source-bound browser case status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-contract-status-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/browser-contract-evidence/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain source-bound desktop performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-performance-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/desktop-performance/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain fixed browser image preflight evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-image-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/browser-image-evidence/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain fixed owned browser memory diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-memory-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/browser-memory/status.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain fixed source-known SVG geometry diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: svg-geometry-${{ matrix.goarch }}-${{ matrix.browser }}
          path: build/svg-geometry/status.json
          if-no-files-found: error
          retention-days: 7
