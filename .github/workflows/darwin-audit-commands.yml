name: Native macOS recorded audit command qualification

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: darwin-audit-commands-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native macOS recorded audit commands (${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goarch: amd64
            sdkarch: x64
    env:
      GO_VERSION: '1.27.3'
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: darwin
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Check command capture source binding
        run: python3 -m unittest discover -s scripts -p test_darwin_audit_command_capture.py -v
      - name: Verify source dependencies
        run: |
          go mod download
          go mod verify
      - name: Native audit and trust foundations without CGO
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: CGO_ENABLED=0 go test ./internal/audit ./internal/darwintrust -run '^TestDarwin' -count=1
      - name: Native audit foundations with race detection
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: go test -race ./internal/audit -run '^TestDarwin' -count=1
      - name: Ordinary recorded commands and signed required-policy acceptance
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_POLICY_TEST: '1'
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_COMMANDS_TEST: '1'
        run: bash scripts/test-darwin-audit-commands.sh
