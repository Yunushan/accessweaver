name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        type: choice
        default: full
        options:
          - full
          - workflow-store
          - workflow-history
          - workflow-lifecycle
          - workflow-reconciliation
          - desktop-diagnostics

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'

jobs:
  browser:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    uses: ./.github/workflows/browser.yml
  windows-audit-storage:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    uses: ./.github/workflows/windows-audit-storage.yml
  darwin-audit-commands:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    uses: ./.github/workflows/darwin-audit-commands.yml
  vulnerabilities:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    name: Go vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOBIN: ${{ github.workspace }}/build/security-tools-bin
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify pinned scanner and workflow validator
        run: |
          go -C scripts/security-tools mod download
          go -C scripts/security-tools mod verify
          go -C scripts/security-tools install golang.org/x/vuln/cmd/govulncheck
          go -C scripts/security-tools install github.com/rhysd/actionlint/cmd/actionlint
          "$GOBIN/actionlint" -shellcheck= -pyflakes=
          python3 -m unittest discover -s scripts -p test_vulnerability_report.py -v
          python3 -m unittest discover -s scripts -p test_darwin_audit_command_capture.py -v
      - name: Verify optional fixture dependencies and compile (no guest execution)
        run: |
          go -C scripts/fixtures/wgpeer mod download
          go -C scripts/fixtures/wgpeer mod verify
          go -C scripts/fixtures/wgpeer test ./... -count=1
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wgpeer.exe" .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/probe.exe" ./cmd/probe
      - name: Build fixture SBOMs and validate pinned CycloneDX schemas
        run: |
          go -C scripts/sbom-tools mod download
          go -C scripts/sbom-tools mod verify
          go -C scripts/sbom-tools test ./... -count=1
          go -C scripts/sbom-tools build -mod=readonly -trimpath -o "$RUNNER_TEMP/sbom-schema" .
          mkdir -p build/sbom-checks
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/wgpeer.exe" --module-root scripts/fixtures/wgpeer --main . --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/wgpeer.cdx.json
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/probe.exe" --module-root scripts/fixtures/wgpeer --main ./cmd/probe --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/probe.cdx.json
          "$RUNNER_TEMP/sbom-schema" --schemas scripts/sbom/schema build/sbom-checks/wgpeer.cdx.json build/sbom-checks/probe.cdx.json
      - name: Retain fixture SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-sbom-check
          path: build/sbom-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check known vulnerabilities for all core targets and fixture environments
        run: GOVULNCHECK="$GOBIN/govulncheck" bash scripts/check-vulnerabilities.sh
      - name: Retain scanner evidence, including failed reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-vulnerability-reports
          path: build/security-checks/
          if-no-files-found: ignore
          retention-days: 14
  test:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            sdkarch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            sdkarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            sdkarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            sdkarch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: ${{ matrix.goos }}
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Check native identity rejection cases
        run: |
          node --test scripts/check-native-environment.test.cjs scripts/check-packaged-evidence.test.cjs scripts/check-profile-benchmark.test.cjs
          node --check scripts/test-packaged-diagnostics.cjs
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        env:
          ACCESSWEAVER_NATIVE_DISCOVERY_REPORT_DIR: ${{ github.workspace }}/build/native-discovery-checks
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: ${{ runner.os == 'macOS' && '1' || '' }}
        run: go test ./... -count=1
      - name: Native Windows audit identity refusal (own-token fixture)
        if: runner.os == 'Windows'
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_TEST: '1'
        run: go test ./internal/audit -run '^TestWindowsAuditProcessImpersonationRefused$' -count=1 -v
      - name: Retain native Windows discovery timings
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-discovery-windows-${{ matrix.goarch }}
          path: build/native-discovery-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Race native macOS engine lifecycle
        if: runner.os == 'macOS'
        run: go test -race ./internal/engine ./cmd/accessweaver -count=1
      - name: Native macOS engine lifecycle without CGO
        if: runner.os == 'macOS'
        shell: bash
        run: CGO_ENABLED=0 go test ./internal/engine ./cmd/accessweaver -count=1
      - name: Race macOS paired policy and audit storage
        if: runner.os == 'macOS'
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: go test -race ./internal/managed ./internal/audit -run '^TestDarwin' -count=1
      - name: Native macOS trust and paired storage without CGO
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_AUDIT_TEST: '1'
        run: CGO_ENABLED=0 go test ./internal/darwintrust ./internal/managed ./internal/audit -run '^TestDarwin' -count=1 -v
      - name: Retain macOS trust preflight
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-trust-preflight-${{ matrix.goarch }}
          path: build/darwin-trust-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Fuzz private workflow metadata encoding
        if: runner.os == 'Linux'
        run: go test ./internal/workflow -run '^$' -fuzz '^FuzzWorkflowMetadataOutput$' -fuzztime=20s -parallel=2
      - name: Fuzz canonical audit event and checkpoint decoding
        if: runner.os == 'Linux'
        run: go test ./internal/audit -run '^$' -fuzz '^FuzzCanonicalAuditDecoders$' -fuzztime=10s -parallel=2
      - name: Measure native concurrent profile inventory
        run: node scripts/check-profile-benchmark.cjs
      - name: Retain source-bound profile benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-benchmark-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/profile-benchmarks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build core
        run: go build ./cmd/accessweaver
      - name: Verify executed native CLI identity
        run: |
          go build ./cmd/accessweaver
          node scripts/check-native-environment.cjs --binary ./accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Retain native platform identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-identity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/native-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable macOS cross-user session ACL regression
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_SESSION_TEST: '1'
        run: bash scripts/test-darwin-session.sh
      - name: Retain macOS session ACL evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-session-acl-check-${{ matrix.goarch }}
          path: build/darwin-session-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Native Unix controller ownership and shutdown
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-controller.py ./accessweaver
      - name: Native Linux cross-user session isolation
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-session.sh ./accessweaver
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          node --check web/system.js
          node --check web/locales.js
      - name: Native signed recovery interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-recovery-interop.cjs
      - name: Retain recovery interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-interop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/managed-policy-checks/recovery-interop-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Native encrypted backup interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-backup-interop.cjs
      - name: Retain native backup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-check-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/backup-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Portable archive metadata regression checks
        run: |
          python3 -m unittest discover -s scripts -p test_release_archive.py -v
          python3 -m unittest discover -s scripts -p test_release_provenance.py -v
          python3 -m unittest discover -s scripts -p test_release_rebuild.py -v
          python3 -m unittest discover -s scripts -p test_stage_packaged_native.py -v
          python3 -m unittest discover -s scripts -p test_windows_handle_census.py -v
          python3 -m unittest discover -s scripts -p test_packaged_windows_discovery.py -v
          python3 -m unittest discover -s scripts -p test_sbom.py -v
          python3 -m unittest discover -s scripts -p test_macos_installer.py -v
          python3 -m unittest discover -s scripts -p test_macos_package_archive.py -v
          python3 -m unittest discover -s scripts -p test_macos_installer_provenance.py -v
          python3 -m unittest discover -s scripts -p test_macos_deployment.py -v
          python3 -m unittest discover -s scripts -p test_macos_deployment_provenance.py -v
          python3 -m unittest discover -s scripts -p test_windows_installer_provenance.py -v
          python3 -m unittest discover -s scripts -p test_darwin_storage.py -v
          python3 -m unittest discover -s scripts -p test_bsd_guest.py -v
          python3 -m unittest discover -s scripts -p test_openbsd_guest.py -v
      - name: Windows workflow contracts (no system changes)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-workflow.ps1
      - name: Windows component acquisition contracts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-component-downloads.ps1
      - name: Windows component acquisition contracts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stockShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          & $stockShell -NoProfile -NonInteractive -File ./scripts/test-windows-component-downloads.ps1 -RequireWindowsPowerShell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows workflow result writer contracts (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $interop = Join-Path $env:RUNNER_TEMP ('workflow-result-ps7-'+[guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($interop)
          ./scripts/test-windows-workflow-results.ps1 -InteropDirectory $interop
          $env:ACCESSWEAVER_WORKER_RESULT_INTEROP = $interop
          go test ./internal/workflow -run '^TestWorkerReportPowerShellInterop$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows workflow result writer contracts (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stockShell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $interop = Join-Path $env:RUNNER_TEMP ('workflow-result-ps51-'+[guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($interop)
          & $stockShell -NoProfile -NonInteractive -File ./scripts/test-windows-workflow-results.ps1 -RequireWindowsPowerShell -InteropDirectory $interop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ACCESSWEAVER_WORKER_RESULT_INTEROP = $interop
          go test ./internal/workflow -run '^TestWorkerReportPowerShellInterop$' -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile unsigned Windows installer (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-installer.ps1 -ExpectedCompilerVersion '6.7.1' -TargetArch '${{ matrix.goarch }}'
      - name: Retain Windows installer compilation evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-compile-check-${{ matrix.goarch }}
          path: |
            build/installer-checks/
            build/accessweaver-*-windows-${{ matrix.goarch }}-setup.exe
            build/accessweaver-*-windows-${{ matrix.goarch }}-setup.exe.cdx.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable macOS managed-policy acceptance
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_POLICY_TEST: '1'
        run: bash scripts/test-darwin-managed-policy.sh
      - name: Retain macOS managed-policy acceptance evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable macOS APFS exhaustion acceptance
        if: runner.os == 'macOS'
        shell: bash
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_STORAGE_TEST: '1'
        run: python3 scripts/test-darwin-storage.py
      - name: Retain macOS APFS exhaustion evidence
        if: runner.os == 'macOS' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-storage-fault-check-${{ matrix.goarch }}
          path: build/darwin-storage-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Linux managed-policy acceptance
        if: runner.os == 'Linux'
        env:
          ACCESSWEAVER_DISPOSABLE_LINUX_POLICY_TEST: '1'
        run: bash scripts/test-linux-managed-policy.sh
      - name: Retain Linux managed-policy acceptance evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Windows managed-policy acceptance
        if: runner.os == 'Windows'
        shell: powershell
        env:
          ACCESSWEAVER_DISPOSABLE_POLICY_TEST: '1'
        run: |
          go test ./cmd/accessweaver -run '^TestDisposableManagedPolicyNative$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/managed -run '^TestDisposablePolicyTransactionRollback$' -count=1 -v
      - name: Retain managed-policy acceptance evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser logic and fixture cleanup tests
        run: node --test web/app.test.cjs scripts/browser-tests/core-fixture.test.cjs scripts/browser-tests/accessibility-report.test.cjs
      - name: Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal web)"
  race:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: linux
      ACCESSWEAVER_EXPECT_GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify native race SDK identity
        run: node scripts/check-native-environment.cjs
      - run: go test -race ./... -count=1
  race-arm64:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    name: Race detector (Linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: linux
      ACCESSWEAVER_EXPECT_GOARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: arm64
      - name: Verify native race SDK identity
        run: node scripts/check-native-environment.cjs
      - run: go test -race ./... -count=1
  cross-compile:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.scope != 'workflow-store' && inputs.scope != 'workflow-history' && inputs.scope != 'workflow-lifecycle' && inputs.scope != 'desktop-diagnostics' && inputs.scope != 'workflow-reconciliation') }}
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64, freebsd/amd64, freebsd/arm64, openbsd/amd64, openbsd/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cross-build core (does not run the target)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/build-all.sh "$TARGET"
  # Manual candidate-only fixture check. The regular push/PR/full matrix above
  # stays complete. This does not certify installed or managed endpoints.
  workflow-store:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.scope == 'workflow-store' || inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' || inputs.scope == 'workflow-reconciliation') }}
    name: ${{ inputs.scope == 'workflow-reconciliation' && 'Workflow reconciliation' || inputs.scope == 'desktop-diagnostics' && 'Desktop diagnostics' || inputs.scope == 'workflow-lifecycle' && 'Workflow lifecycle' || inputs.scope == 'workflow-history' && 'Workflow history' || 'Workflow store' }} (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            sdkarch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            sdkarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            sdkarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            sdkarch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: ${{ matrix.goos }}
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hostOS = (go env GOHOSTOS).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Go host OS unavailable' }
          $hostArch = (go env GOHOSTARCH).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Go host architecture unavailable' }
          if ($hostOS -ne $env:ACCESSWEAVER_EXPECT_GOOS -or $hostArch -ne $env:ACCESSWEAVER_EXPECT_GOARCH) { throw 'Go host target mismatch' }
      - name: Verify dependencies
        run: go mod verify
      - name: Test native persistent file locks
        run: go test ./internal/filelock -count=1 -timeout=3m
      - name: Test workflow store admission, lifetime and subprocess fixtures
        if: ${{ inputs.scope != 'workflow-reconciliation' }}
        run: go test ./internal/workflow -run '^TestWorkflowStore' -count=1 -timeout=4m
      - name: Test workflow history inventory and exact records
        if: ${{ inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' }}
        run: go test ./internal/workflow -run '^TestWorkflowHistory' -count=1 -timeout=5m
      - name: Test history API and CLI contracts
        if: ${{ inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' || inputs.scope == 'workflow-reconciliation' }}
        run: go test ./internal/api ./cmd/accessweaver -run '^(TestHistoryBrowser|TestSystemHistoryBrowser)' -count=1 -timeout=5m
      - name: Test private history file creation
        if: ${{ inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' || inputs.scope == 'workflow-reconciliation' }}
        run: go test ./internal/privatefile -count=1 -timeout=3m
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' || inputs.scope == 'workflow-reconciliation' }}
        with:
          node-version: '26.8.2'
          package-manager-cache: false
      - name: Verify actual Go history responses with desktop source
        if: ${{ inputs.scope == 'workflow-history' || inputs.scope == 'workflow-lifecycle' || inputs.scope == 'desktop-diagnostics' || inputs.scope == 'workflow-reconciliation' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP ('accessweaver-history-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          $env:ACCESSWEAVER_HISTORY_INTEROP = $fixture
          go test ./internal/api -run '^TestHistoryBrowserSourceWireInterop$' -count=1 -timeout=2m
          if ($LASTEXITCODE -ne 0) { throw 'History response producer failed' }
          node web/app.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'History desktop contract verification failed' }
      - name: Static analysis history staging contracts
        if: ${{ inputs.scope == 'workflow-history' }}
        run: go vet ./internal/workflow ./internal/api ./cmd/accessweaver
      - name: Race native history staging admission and preserved reads
        if: ${{ inputs.scope == 'workflow-history' && runner.os != 'Windows' }}
        run: |
          go test -race ./internal/workflow -run '^TestWorkflowHistory' -count=1 -timeout=6m
          go test -race ./internal/api ./cmd/accessweaver -run '^(TestHistoryBrowser|TestSystemHistoryBrowser)' -count=1 -timeout=5m
      - name: Test workflow lifecycle receipts and worker reports
        if: ${{ inputs.scope == 'workflow-lifecycle' }}
        run: go test ./internal/workflow -run '^(TestWorkflowLifecycle|TestWorkerReport)' -count=1 -timeout=5m
      - name: Test signed history-retirement permission
        if: ${{ inputs.scope == 'workflow-lifecycle' }}
        run: go test ./internal/managed -run '^TestHistoryRetirement' -count=1 -timeout=3m
      - name: Test lifecycle API and CLI status
        if: ${{ inputs.scope == 'workflow-lifecycle' }}
        run: go test ./internal/api ./cmd/accessweaver -run '^(TestHistoryLifecycle|TestSystemHistoryLifecycle)' -count=1 -timeout=3m
      - name: PowerShell7 archive and finalization source contracts
        if: ${{ inputs.scope == 'workflow-lifecycle' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/test-windows-component-archives.ps1
          if (-not $?) { throw 'Archive source contracts failed' }
          $fixture = Join-Path $env:RUNNER_TEMP ('accessweaver-finalizer-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          & ./scripts/test-windows-workflow-finalization.ps1 -InteropDirectory $fixture
          if (-not $?) { throw 'Finalizer source producer failed' }
          $env:ACCESSWEAVER_WORKER_FINALIZATION_INTEROP = $fixture
          go test ./internal/workflow -run '^TestWorkerReportFinalizationPowerShellInterop$' -count=1 -timeout=2m
          if ($LASTEXITCODE -ne 0) { throw 'Finalizer report receiver failed' }
      - name: Windows PowerShell5.1 archive and finalization source contracts
        if: ${{ inputs.scope == 'workflow-lifecycle' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stock = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-windows-component-archives.ps1 -RequireWindowsPowerShell
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell archive contracts failed' }
          $fixture = Join-Path $env:RUNNER_TEMP ('accessweaver-finalizer51-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          & $stock -NoProfile -NonInteractive -File ./scripts/test-windows-workflow-finalization.ps1 -RequireWindowsPowerShell -InteropDirectory $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell finalizer producer failed' }
          $env:ACCESSWEAVER_WORKER_FINALIZATION_INTEROP = $fixture
          go test ./internal/workflow -run '^TestWorkerReportFinalizationPowerShellInterop$' -count=1 -timeout=2m
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell finalizer receiver failed' }
      - name: Test diagnostic transport and cancellation ownership
        if: ${{ inputs.scope == 'desktop-diagnostics' }}
        run: go test ./internal/diagnostics -count=1 -timeout=3m
      - name: Test diagnostic HTTP admission and request cancellation
        if: ${{ inputs.scope == 'desktop-diagnostics' }}
        run: go test ./internal/api -run '^TestDiagnostic' -count=1 -timeout=3m
      - name: Static analysis diagnostic and API contracts
        if: ${{ inputs.scope == 'desktop-diagnostics' }}
        run: go vet ./internal/diagnostics ./internal/api
      - name: Race native diagnostic cancellation and admission
        if: ${{ inputs.scope == 'desktop-diagnostics' && runner.os != 'Windows' }}
        run: |
          go test -race ./internal/diagnostics -count=1 -timeout=3m
          go test -race ./internal/api -run '^TestDiagnostic' -count=1 -timeout=4m
      - name: Test complete workflow ownership and reconciliation contracts
        if: ${{ inputs.scope == 'workflow-reconciliation' }}
        run: go test ./internal/workflow -count=1 -timeout=5m
      - name: Test signed lifecycle-reconciliation permission and review binding
        if: ${{ inputs.scope == 'workflow-reconciliation' }}
        run: go test ./internal/managed -run '^TestLifecycleReconciliation' -count=1 -timeout=3m
      - name: Test reconciliation API and CLI review contracts
        if: ${{ inputs.scope == 'workflow-reconciliation' }}
        run: go test ./internal/api ./cmd/accessweaver -run '^(TestLifecycleReconciliationAPI|TestSystemHistoryReconciliation)' -count=1 -timeout=3m
      - name: Verify actual Go reconciliation responses with desktop source
        if: ${{ inputs.scope == 'workflow-reconciliation' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP ('accessweaver-reconciliation-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -ErrorAction Stop | Out-Null
          $env:ACCESSWEAVER_RECONCILIATION_INTEROP = $fixture
          go test ./internal/workflow -run '^TestLifecycleReconciliationDesktopWireInterop$' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Reconciliation response producer failed' }
          node web/app.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Reconciliation desktop contract verification failed' }
      - name: Static analysis workflow reconciliation contracts
        if: ${{ inputs.scope == 'workflow-reconciliation' }}
        run: go vet ./internal/workflow ./internal/managed ./internal/api ./cmd/accessweaver
      - name: Race native workflow reconciliation ownership
        if: ${{ inputs.scope == 'workflow-reconciliation' && runner.os != 'Windows' }}
        run: |
          go test -race ./internal/workflow -count=1 -timeout=6m
          go test -race ./internal/managed -run '^TestLifecycleReconciliation' -count=1 -timeout=3m
          go test -race ./internal/api ./cmd/accessweaver -run '^(TestLifecycleReconciliationAPI|TestSystemHistoryReconciliation)' -count=1 -timeout=4m
