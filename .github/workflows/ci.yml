name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.3'

jobs:
  browser:
    uses: ./.github/workflows/browser.yml
  vulnerabilities:
    name: Go vulnerability checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOBIN: ${{ github.workspace }}/build/security-tools-bin
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify pinned scanner and workflow validator
        run: |
          go -C scripts/security-tools mod download
          go -C scripts/security-tools mod verify
          go -C scripts/security-tools install golang.org/x/vuln/cmd/govulncheck
          go -C scripts/security-tools install github.com/rhysd/actionlint/cmd/actionlint
          "$GOBIN/actionlint" -shellcheck= -pyflakes=
          python3 -m unittest discover -s scripts -p test_vulnerability_report.py -v
      - name: Verify optional fixture dependencies and compile (no guest execution)
        run: |
          go -C scripts/fixtures/wgpeer mod download
          go -C scripts/fixtures/wgpeer mod verify
          go -C scripts/fixtures/wgpeer test ./... -count=1
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/wgpeer.exe" .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go -C scripts/fixtures/wgpeer build -trimpath -buildvcs=false -o "$RUNNER_TEMP/probe.exe" ./cmd/probe
      - name: Build fixture SBOMs and validate pinned CycloneDX schemas
        run: |
          go -C scripts/sbom-tools mod download
          go -C scripts/sbom-tools mod verify
          go -C scripts/sbom-tools test ./... -count=1
          go -C scripts/sbom-tools build -mod=readonly -trimpath -o "$RUNNER_TEMP/sbom-schema" .
          mkdir -p build/sbom-checks
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/wgpeer.exe" --module-root scripts/fixtures/wgpeer --main . --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/wgpeer.cdx.json
          python3 scripts/sbom.py --binary "$RUNNER_TEMP/probe.exe" --module-root scripts/fixtures/wgpeer --main ./cmd/probe --fixture --notices build/sbom-checks/licenses --out build/sbom-checks/probe.cdx.json
          "$RUNNER_TEMP/sbom-schema" --schemas scripts/sbom/schema build/sbom-checks/wgpeer.cdx.json build/sbom-checks/probe.cdx.json
      - name: Retain fixture SBOM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-sbom-check
          path: build/sbom-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Check known vulnerabilities for all core targets and fixture environments
        run: GOVULNCHECK="$GOBIN/govulncheck" bash scripts/check-vulnerabilities.sh
      - name: Retain scanner evidence, including failed reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-vulnerability-reports
          path: build/security-checks/
          if-no-files-found: ignore
          retention-days: 14
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            sdkarch: x64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            sdkarch: arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goos: windows
            goarch: arm64
            sdkarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            sdkarch: arm64
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            sdkarch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: ${{ matrix.goos }}
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Check native identity rejection cases
        run: |
          node --test scripts/check-native-environment.test.cjs scripts/check-packaged-evidence.test.cjs scripts/check-profile-benchmark.test.cjs
          node --check scripts/test-packaged-diagnostics.cjs
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test ./... -count=1
      - name: Measure native concurrent profile inventory
        run: node scripts/check-profile-benchmark.cjs
      - name: Retain source-bound profile benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-benchmark-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/profile-benchmarks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build core
        run: go build ./cmd/accessweaver
      - name: Verify executed native CLI identity
        run: |
          go build ./cmd/accessweaver
          node scripts/check-native-environment.cjs --binary ./accessweaver${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Retain native platform identity
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-identity-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/native-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Native Unix controller ownership and shutdown
        if: runner.os != 'Windows'
        run: python3 scripts/test-unix-controller.py ./accessweaver
      - name: Native Linux cross-user session isolation
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-session.sh ./accessweaver
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node --check web/app.js
          node --check web/system.js
          node --check web/locales.js
      - name: Native signed recovery interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-recovery-interop.cjs
      - name: Retain recovery interoperability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-interop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/managed-policy-checks/recovery-interop-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Native encrypted backup interoperability
        run: |
          go build ./cmd/accessweaver
          node scripts/test-backup-interop.cjs
      - name: Retain native backup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-check-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/backup-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Portable archive metadata regression checks
        run: |
          python3 -m unittest discover -s scripts -p test_release_archive.py -v
          python3 -m unittest discover -s scripts -p test_release_provenance.py -v
          python3 -m unittest discover -s scripts -p test_stage_packaged_native.py -v
          python3 -m unittest discover -s scripts -p test_sbom.py -v
      - name: Windows workflow contracts (no system changes)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-workflow.ps1
      - name: Compile unsigned Windows installer (no installation)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-windows-installer.ps1 -ExpectedCompilerVersion '6.7.1'
      - name: Retain Windows installer compilation evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-compile-check-${{ matrix.goarch }}
          path: |
            build/installer-checks/
            build/accessweaver-*-windows-amd64-setup.exe
            build/accessweaver-*-windows-amd64-setup.exe.cdx.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Linux managed-policy acceptance
        if: runner.os == 'Linux'
        env:
          ACCESSWEAVER_DISPOSABLE_LINUX_POLICY_TEST: '1'
        run: bash scripts/test-linux-managed-policy.sh
      - name: Retain Linux managed-policy acceptance evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Disposable Windows managed-policy acceptance
        if: runner.os == 'Windows'
        shell: powershell
        env:
          ACCESSWEAVER_DISPOSABLE_POLICY_TEST: '1'
        run: |
          go test ./cmd/accessweaver -run '^TestDisposableManagedPolicyNative$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./internal/managed -run '^TestDisposablePolicyTransactionRollback$' -count=1 -v
      - name: Retain managed-policy acceptance evidence
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-managed-policy-check-${{ matrix.goarch }}
          path: build/managed-policy-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Browser logic tests
        if: runner.os == 'Linux'
        run: node --test web/app.test.cjs
      - name: Go formatting
        if: runner.os == 'Linux'
        shell: bash
        run: test -z "$(gofmt -l cmd internal web)"
  race:
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: linux
      ACCESSWEAVER_EXPECT_GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify native race SDK identity
        run: node scripts/check-native-environment.cjs
      - run: go test -race ./... -count=1
  race-arm64:
    name: Race detector (Linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: linux
      ACCESSWEAVER_EXPECT_GOARCH: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: arm64
      - name: Verify native race SDK identity
        run: node scripts/check-native-environment.cjs
      - run: go test -race ./... -count=1
  cross-compile:
    name: Cross-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [linux/amd64, linux/arm64, windows/amd64, windows/arm64, darwin/amd64, darwin/arm64, freebsd/amd64, freebsd/arm64, openbsd/amd64, openbsd/arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Cross-build core (does not run the target)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/build-all.sh "$TARGET"
