          $env:ACCESSWEAVER_DARWIN_READ_ACQUISITION_REPORT = $normalEvidence
          go test -p=2 ./internal/darwintrust ./internal/managed ./internal/packageupgrade -count=1 -timeout=4m
          if ($LASTEXITCODE -ne 0) { throw 'Darwin native reader regression contracts failed' }
          $raceEvidence = Join-Path $readEvidence 'race'
          New-Item -ItemType Directory -Path $raceEvidence -ErrorAction Stop | Out-Null
          $env:ACCESSWEAVER_DARWIN_READ_ACQUISITION_REPORT = $raceEvidence
          go test -race -p=2 ./internal/darwintrust ./internal/managed ./internal/packageupgrade -count=1 -timeout=4m
          if ($LASTEXITCODE -ne 0) { throw 'Darwin native reader race contracts failed' }
          go vet -p=2 ./internal/darwintrust ./internal/managed ./internal/packageupgrade
          if ($LASTEXITCODE -ne 0) { throw 'Darwin native reader static analysis failed' }
      - name: Retain native Darwin read acquisition evidence
        if: ${{ always() && inputs.scope == 'profile-read' && matrix.goos == 'darwin' && env.ACCESSWEAVER_DARWIN_READ_ACQUISITION_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-read-acquisition-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_DARWIN_READ_ACQUISITION_EVIDENCE }}/**/darwin-read-acquisition.json
          if-no-files-found: error
          retention-days: 7
      - name: Test native Darwin runtime read completion
        if: inputs.scope == 'profile-read' && matrix.goos == 'darwin'
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_RUNTIME_READ_TEST: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeReadEvidence = Join-Path $env:RUNNER_TEMP ('accessweaver-darwin-runtime-read-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $runtimeReadEvidence -ErrorAction Stop | Out-Null
          foreach ($mode in @('normal', 'race')) {
            New-Item -ItemType Directory -Path (Join-Path $runtimeReadEvidence $mode) -ErrorAction Stop | Out-Null
          }
          $env:ACCESSWEAVER_DARWIN_RUNTIME_READ_EVIDENCE = $runtimeReadEvidence
          ('ACCESSWEAVER_DARWIN_RUNTIME_READ_EVIDENCE=' + $runtimeReadEvidence) | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append -ErrorAction Stop
          /usr/bin/python3 scripts/test_darwin_runtime_read_completion.py
          if ($LASTEXITCODE -ne 0) { throw 'Native reader collector contracts failed' }
          /usr/bin/python3 scripts/test-darwin-runtime-read-completion.py
          if ($LASTEXITCODE -ne 0) { throw 'Native root runtime reader contracts failed' }
      - name: Retain native Darwin runtime read evidence
        if: ${{ always() && inputs.scope == 'profile-read' && matrix.goos == 'darwin' && env.ACCESSWEAVER_DARWIN_RUNTIME_READ_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-runtime-read-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_DARWIN_RUNTIME_READ_EVIDENCE }}/**/darwin-runtime-read.json
          if-no-files-found: error
          retention-days: 7
      - name: Test DNS snapshot and recovery contracts
        if: inputs.scope == 'profile-read'
        run: |
          $ErrorActionPreference = 'Stop'
          $dnsEvidence = Join-Path $env:RUNNER_TEMP ('accessweaver-dns-contracts-' + [Guid]::NewGuid().ToString('N'))
          $env:ACCESSWEAVER_DNS_CONTRACT_EVIDENCE = $dnsEvidence
          ('ACCESSWEAVER_DNS_CONTRACT_EVIDENCE=' + $dnsEvidence) | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append -ErrorAction Stop
          $coreEvidence = Join-Path $dnsEvidence 'core'
          New-Item -ItemType Directory -Path $coreEvidence -Force -ErrorAction Stop | Out-Null
          ./scripts/test-dns-recovery-contracts.ps1 -ReportPath (Join-Path $coreEvidence 'dns-contracts.json')
          if ($env:RUNNER_OS -eq 'Windows') {
            $desktopShell = Join-Path $env:windir 'System32/WindowsPowerShell/v1.0/powershell.exe'
            $desktopEvidence = Join-Path $dnsEvidence 'desktop'
            New-Item -ItemType Directory -Path $desktopEvidence -ErrorAction Stop | Out-Null
            & $desktopShell -NoProfile -NonInteractive -File scripts/test-dns-recovery-contracts.ps1 -RequireWindowsPowerShell -ReportPath (Join-Path $desktopEvidence 'dns-contracts.json')
            if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell DNS source contracts failed' }
          }
      - name: Retain DNS source contract evidence
        if: ${{ always() && inputs.scope == 'profile-read' && env.ACCESSWEAVER_DNS_CONTRACT_EVIDENCE != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dns-source-contracts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_DNS_CONTRACT_EVIDENCE }}/**/dns-contracts.json
          if-no-files-found: error
          retention-days: 7
      - name: Test ordinary CLI input and cleanup contracts
        if: inputs.scope == 'profile-read'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./cmd/accessweaver -run '^TestOrdinary' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Ordinary CLI completion contracts failed' }
          if ($env:RUNNER_OS -ne 'Windows') {
            go test -race ./cmd/accessweaver -run '^TestOrdinary' -count=1 -timeout=3m
            if ($LASTEXITCODE -ne 0) { throw 'Ordinary CLI completion race contracts failed' }
          }
      - name: Test pre-start cleanup retention contracts
        if: inputs.scope == 'profile-read'
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./internal/engine -run '^TestPreStart' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Pre-start cleanup contracts failed' }
          if ($env:RUNNER_OS -ne 'Windows') {
            go test -race ./internal/engine -run '^TestPreStart' -count=1 -timeout=3m
            if ($LASTEXITCODE -ne 0) { throw 'Pre-start cleanup race contracts failed' }
          }
      - name: Test generated input write completion contracts
        if: inputs.scope == 'profile-read'
        run: go test ./internal/engine -run '^Test(AtomicWriteGenerated|ExecutableHashCompletion|ConfigInput|PreparationContext)' -count=1 -timeout=3m
      - name: Race test backup I/O ownership
        if: runner.os != 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          go test -race ./internal/fileinput ./internal/privatefile ./internal/filelock ./internal/backup ./internal/profile -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Backup I/O package race contracts failed' }
          go test -race ./cmd/accessweaver -run '^TestBackup' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Backup CLI race contracts failed' }
      - name: Race test profile read completion contracts
        if: runner.os != 'Windows' && inputs.scope == 'profile-read'
        run: |
          $ErrorActionPreference = 'Stop'
          go test -race ./internal/api -run '^Test(EnginePreparation|Profile(Read|Mutation)|AtomicWriteAPI|AuditedProfile(ReadUncertainty|Mutation|AtomicWrite|WriteKeepsCompletedOutcomeWhenResponseReadFails|ActualCRUDAndRevisionRefusal)|AuditedAPIFailClosedBeforeStoreAndAfterUncertainResult|CleanMissingProfileRemainsNotFoundAndCanBeCreated)' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Profile read API race contracts failed' }
          go test -race ./cmd/accessweaver -run '^Test(AuditImport(Read|Mutation|AtomicWrite)Completion|ForegroundEngine|RecordedEngineLifecycle)' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Profile import read completion race contracts failed' }
          go test -race ./internal/engine -run '^Test(AtomicWriteGenerated|ExecutableHashCompletion|ConfigInput|PreparationContext)' -count=1 -timeout=3m
          if ($LASTEXITCODE -ne 0) { throw 'Generated input write completion race contracts failed' }
      - name: Build source-bound CLI and verify independent Web Crypto interoperability
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $candidate -ne $env:GITHUB_SHA) { throw 'Backup source identity mismatch' }
          $changes = git status --porcelain --untracked-files=all
          if ($LASTEXITCODE -ne 0 -or $changes) { throw 'Backup CLI requires clean committed source' }
          $extension = if ($env:RUNNER_OS -eq 'Windows') { '.exe' } else { '' }
          $binary = Join-Path $env:RUNNER_TEMP ('accessweaver-backup-' + $env:ACCESSWEAVER_EXPECT_GOOS + '-' + $env:ACCESSWEAVER_EXPECT_GOARCH + $extension)
          $link = '-X github.com/Yunushan/accessweaver/internal/buildinfo.Commit=' + $env:GITHUB_SHA + ' -X github.com/Yunushan/accessweaver/internal/buildinfo.SourceState=clean'
          go build -trimpath -buildvcs=true -ldflags $link -o $binary ./cmd/accessweaver
          if ($LASTEXITCODE -ne 0) { throw 'Source-bound backup CLI build failed' }
          node scripts/check-native-environment.cjs --binary $binary
          if ($LASTEXITCODE -ne 0) { throw 'Backup CLI native source binding failed' }
          node scripts/test-backup-interop.cjs $binary
          if ($LASTEXITCODE -ne 0) { throw 'Native backup Web Crypto interoperability failed' }
      - name: Static analysis backup I/O contracts
        run: go vet ./internal/fileinput ./internal/privatefile ./internal/filelock ./internal/backup ./internal/profile ./cmd/accessweaver
      - name: Static analysis profile read contracts
        if: inputs.scope == 'profile-read'
        run: go vet ./internal/api ./internal/engine
