name: Native Windows DNS readback controls

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'internal/workflow/windows.ps1'
      - 'scripts/test-native-dns-readback.ps1'
      - 'scripts/check-native-environment.cjs'
      - '.github/workflows/native-dns-readback.yml'
  pull_request:
    paths:
      - 'internal/workflow/windows.ps1'
      - 'scripts/test-native-dns-readback.ps1'
      - 'scripts/check-native-environment.cjs'
      - '.github/workflows/native-dns-readback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-dns-readback-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  native:
    name: Native DNS readback (windows/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, os: windows-latest, sdkarch: x64}
          - {goarch: arm64, os: windows-11-arm, sdkarch: arm64}
    defaults:
      run:
        shell: pwsh
    env:
      ACCESSWEAVER_EXPECT_GOOS: windows
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: ${{ matrix.sdkarch }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.sdkarch }}
          package-manager-cache: false
      - name: Verify hosted native SDK and machine identity
        run: node scripts/check-native-environment.cjs
      - name: Check actual dual-family inventory and mismatch refusal
        run: |
          $ErrorActionPreference='Stop'
          $fixed=Join-Path $env:RUNNER_TEMP ('accessweaver-dns-readback-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixed -ErrorAction Stop | Out-Null
          "ACCESSWEAVER_DNS_READBACK=$fixed" >> $env:GITHUB_ENV
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-native-dns-readback.ps1 -ReportPath (Join-Path $fixed 'status.json')
          if($LASTEXITCODE -ne 0){throw 'Native DNS readback controls failed; fixed metadata retained'}
      - name: Retain fixed readback metadata only
        if: always() && env.ACCESSWEAVER_DNS_READBACK != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dns-readback-windows-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_DNS_READBACK }}/status.json
          if-no-files-found: error
          retention-days: 7
