name: BSD guest core probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bsd-core-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local

jobs:
  freebsd-amd64:
    name: FreeBSD 15.1 amd64 guest core
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: x64
          cache: false
      - name: Check guest guard and resource regressions
        run: python3 -m unittest discover -s scripts -p test_bsd_guest.py -v
      - name: Install distribution-signed hypervisor and ISO tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y qemu-system-x86 qemu-utils xorriso openssh-client
      - name: Execute core candidate inside the pinned guest
        env:
          ACCESSWEAVER_DISPOSABLE_BSD_GUEST_TEST: '1'
        run: python3 scripts/test-bsd-guest.py
      - name: Retain guest execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-amd64-guest-core
          path: build/bsd-native-checks/
          if-no-files-found: ignore
          retention-days: 14
