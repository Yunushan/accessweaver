name: Intel macOS APFS pressure diagnostics

on:
  push:
    branches: ['codex/darwin-apfs-pressure-diagnostics']
    paths:
      - .github/workflows/darwin-apfs-pressure-diagnostics.yml
      - internal/managed/storage_full_darwin_test.go
      - scripts/test-darwin-storage.py

permissions:
  contents: read

jobs:
  intel-apfs:
    if: github.repository == 'Yunushan/accessweaver'
    name: Disposable APFS pressure (darwin/amd64)
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      GO_VERSION: '1.27.4'
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOARCH: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: x64
      - name: Verify the hosted diagnostic contracts
        run: python3 -m unittest discover -s scripts -p test_darwin_storage.py
      - name: Exercise the existing disposable APFS pressure cases
        env:
          ACCESSWEAVER_DISPOSABLE_DARWIN_STORAGE_TEST: '1'
        run: python3 scripts/test-darwin-storage.py
      - name: Retain fixed source-bound APFS status records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darwin-storage-fault-check-amd64
          path: |
            build/darwin-storage-checks/native-tools-amd64.json
            build/darwin-storage-checks/image-lifecycle-amd64.json
            build/darwin-storage-checks/apfs-exhaustion-amd64.json
          if-no-files-found: error
          retention-days: 14
