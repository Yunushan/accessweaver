name: Windows audit storage qualification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native Windows audit storage (${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goarch: amd64
            sdkarch: x64
          - os: windows-11-arm
            goarch: arm64
            sdkarch: arm64
    env:
      GO_VERSION: '1.27.3'
      GOTOOLCHAIN: local
      ACCESSWEAVER_EXPECT_GOOS: windows
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
          architecture: ${{ matrix.sdkarch }}
      - name: Verify native host and SDK identity
        run: node scripts/check-native-environment.cjs
      - name: Native file identity and bound input output admission
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_STORAGE_TEST: '1'
        shell: pwsh
        run: |
          go test ./internal/fileidentity -run '^TestDisposableWindowsFileIdentityNative$' -count=1 -v -timeout=4m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./cmd/accessweaver -run '^TestWindowsAudit(AliasMetadata|InputSnapshot)$' -count=1 -v -timeout=4m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Protected storage, journal, key and historical export acceptance
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_STORAGE_TEST: '1'
        shell: pwsh
        run: |
          go test ./internal/audit -run '^(TestDisposableWindowsAuditStorageNative|TestWindowsJournal.*|TestWindowsLocal.*)$' -count=1 -v -timeout=10m
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ordinary process identity, profile and cleanup acceptance
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_ORDINARY_TEST: '1'
        shell: pwsh
        run: |
          if ($env:GITHUB_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') { throw 'Source commit unavailable' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cne $env:GITHUB_SHA) { throw 'Source commit mismatch' }
          git -c core.fsmonitor=false diff --quiet --no-ext-diff
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the declared commit' }
          git -c core.fsmonitor=false diff --cached --quiet --no-ext-diff
          if ($LASTEXITCODE -ne 0) { throw 'Staged source differs from the declared commit' }
          $sourceStatus = @(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or $sourceStatus.Count -ne 0) { throw 'Source tree is not clean' }
          $sourceFlags = "-X github.com/Yunushan/accessweaver/internal/buildinfo.Commit=$sourceCommit -X github.com/Yunushan/accessweaver/internal/buildinfo.SourceState=clean"
          go test ./cmd/accessweaver -run '^TestDisposableWindowsAuditOrdinaryProcess$' -count=1 -v -timeout=4m -ldflags $sourceFlags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Ordinary process recorded commands and required policy acceptance
        env:
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_ORDINARY_TEST: '1'
          ACCESSWEAVER_DISPOSABLE_WINDOWS_AUDIT_COMMANDS_TEST: '1'
        shell: pwsh
        run: |
          if ($env:GITHUB_SHA -cnotmatch '^(?:[0-9a-f]{40}|[0-9a-f]{64})$') { throw 'Source commit unavailable' }
          $sourceCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceCommit -cne $env:GITHUB_SHA) { throw 'Source commit mismatch' }
          git -c core.fsmonitor=false diff --quiet --no-ext-diff
          if ($LASTEXITCODE -ne 0) { throw 'Tracked source differs from the declared commit' }
          git -c core.fsmonitor=false diff --cached --quiet --no-ext-diff
          if ($LASTEXITCODE -ne 0) { throw 'Staged source differs from the declared commit' }
          $sourceStatus = @(git -c core.fsmonitor=false status --porcelain=v1 --untracked-files=normal)
          if ($LASTEXITCODE -ne 0 -or $sourceStatus.Count -ne 0) { throw 'Source tree is not clean' }
          $sourceFlags = "-X github.com/Yunushan/accessweaver/internal/buildinfo.Commit=$sourceCommit -X github.com/Yunushan/accessweaver/internal/buildinfo.SourceState=clean"
          go test ./cmd/accessweaver -run '^TestDisposableWindowsAuditCommands$' -count=1 -v -timeout=4m -ldflags $sourceFlags
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain controlled identity and input receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-audit-identity-inputs-${{ matrix.goarch }}
          path: build/windows-audit-identity-input-checks/
          if-no-files-found: error
          retention-days: 14
      - name: Retain controlled native storage receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-audit-storage-${{ matrix.goarch }}
          path: build/windows-audit-storage-checks/
          if-no-files-found: error
          retention-days: 14
      - name: Retain controlled ordinary process receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-audit-ordinary-${{ matrix.goarch }}
          path: build/windows-audit-ordinary-checks/
          if-no-files-found: error
          retention-days: 14
