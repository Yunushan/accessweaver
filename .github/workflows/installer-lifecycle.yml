name: Windows installer lifecycle acceptance

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/dns-adapter-coverage']
    paths:
      - scripts/*windows-installer*
      - scripts/verify_windows_installer_provenance.py
      - scripts/test_windows_installer_provenance.py
      - scripts/verify_windows_event_probe.py
      - scripts/test_windows_event_probe.py
      - scripts/verify_release.py
      - scripts/verify_release_provenance.py
      - scripts/verify_release_rebuild.py
      - scripts/release_archive.py
      - scripts/sbom.py
      - scripts/sbom/**
      - scripts/fixtures/Installer*.cs
      - scripts/fixtures/installer-restoration/**
      - internal/**
      - cmd/accessweaver/**
      - web/**
      - docs/**
      - LICENSE
      - README.md
      - README.tr.md
      - THIRD_PARTY.md
      - SECURITY.md
      - go.mod
      - go.sum
      - .github/workflows/installer-lifecycle.yml

permissions:
  contents: read

concurrency:
  group: installer-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Native installer lifecycle (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: amd64
          - os: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
          cache: false
      - name: Pure provenance contracts
        shell: powershell
        run: python -m unittest discover -s scripts -p test_windows_installer_provenance.py -v
      - name: Pure managed detection contracts
        shell: pwsh
        run: ./scripts/test-windows-installer-detection.ps1
      - name: Pure installer and publisher verification contracts
        shell: powershell
        run: ./scripts/test-windows-installer-contracts.ps1
      - name: Pure event correlation diagnostics
        shell: powershell
        run: ./scripts/test-windows-installer-event-state.ps1
      - name: Pure controlled event fixture contracts
        shell: powershell
        run: |
          ./scripts/test-windows-installer-event-fixture.ps1
          python -m unittest discover -s scripts -p test_windows_event_probe.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Controlled event fixture contracts failed' }
      - name: Controlled native event diagnostic and owned cleanup
        shell: powershell
        env:
          ACCESSWEAVER_DISPOSABLE_INSTALLER_EVENT_TEST: '1'
        run: ./scripts/test-windows-installer-event-native.ps1 -Architecture '${{ matrix.arch }}'
      - name: Validate controlled native probe before attesting
        shell: powershell
        run: |
          python scripts/verify_windows_event_probe.py 'build/installer-event-checks/${{ matrix.arch }}.json' --source-commit "$env:GITHUB_SHA" --source-ref "$env:GITHUB_REF" --architecture '${{ matrix.arch }}' --run-id "$env:GITHUB_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Controlled native probe validation failed' }
      - name: Attest the separate controlled native event report
        id: event-provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/installer-event-checks/${{ matrix.arch }}.json
          create-storage-record: false
      - name: Retain controlled probe provenance bundle
        shell: powershell
        env:
          EVENT_BUNDLE: ${{ steps.event-provenance.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:EVENT_BUNDLE -Destination 'build/installer-event-checks/BUILD-PROVENANCE.sigstore.json' -ErrorAction Stop
      - name: Retain controlled native event evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-event-probe-windows-${{ matrix.arch }}
          path: build/installer-event-checks/
          if-no-files-found: ignore
          retention-days: 14
      - name: Exercise actual unsigned installer on a disposable native host
        shell: powershell
        env:
          ACCESSWEAVER_DISPOSABLE_INSTALLER_ACCEPTANCE: '1'
        run: ./scripts/test-windows-installer-lifecycle.ps1 -Architecture '${{ matrix.arch }}'
      - name: Stage and validate all native subjects before signing
        shell: powershell
        env:
          CANDIDATE_DIRECTORY: build/installer-lifecycle-provenance/${{ matrix.arch }}/candidate
          TARGET_ARCH: '${{ matrix.arch }}'
        run: |
          python scripts/verify_windows_installer_provenance.py "$env:CANDIDATE_DIRECTORY" --stage-build-root build --source-commit "$env:GITHUB_SHA" --source-ref "$env:GITHUB_REF" --architecture "$env:TARGET_ARCH"
          if ($LASTEXITCODE -ne 0) { throw 'Native installer staging/acceptance failed' }
      - name: Attest installer, SBOM and actual native acceptance subjects
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/installer-lifecycle-provenance/${{ matrix.arch }}/candidate/*
          create-storage-record: false
      - name: Retain and authenticate the real native provenance bundle
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          CANDIDATE_DIRECTORY: build/installer-lifecycle-provenance/${{ matrix.arch }}/candidate
          PROVENANCE_DIRECTORY: build/installer-lifecycle-provenance/${{ matrix.arch }}/public
          TARGET_ARCH: '${{ matrix.arch }}'
        run: |
          [void](New-Item -ItemType Directory -Path "$env:PROVENANCE_DIRECTORY")
          $bundle=Join-Path $env:CANDIDATE_DIRECTORY 'BUILD-PROVENANCE.sigstore.json'
          Copy-Item -LiteralPath "$env:ATTESTATION_BUNDLE" -Destination $bundle
          $verification=& python scripts/verify_windows_installer_provenance.py "$env:CANDIDATE_DIRECTORY" --source-commit "$env:GITHUB_SHA" --source-ref "$env:GITHUB_REF" --architecture "$env:TARGET_ARCH" --check-rejections
          if ($LASTEXITCODE -ne 0) { throw 'Native installer cryptographic verification failed' }
          [IO.File]::WriteAllText((Join-Path $env:PROVENANCE_DIRECTORY 'verified.json'),(($verification -join [Environment]::NewLine)+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Copy-Item -LiteralPath $bundle -Destination (Join-Path $env:PROVENANCE_DIRECTORY 'BUILD-PROVENANCE.sigstore.json')
      - name: Retain native installer provenance and verification results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-lifecycle-provenance-windows-${{ matrix.arch }}
          path: build/installer-lifecycle-provenance/${{ matrix.arch }}/public/
          if-no-files-found: error
          retention-days: 14
      - name: Retain the actual unsigned installer candidates and validated SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-lifecycle-candidates-windows-${{ matrix.arch }}
          path: |
            build/accessweaver-0.1.0-alpha-windows-${{ matrix.arch }}-setup.exe
            build/accessweaver-0.1.0-alpha-windows-${{ matrix.arch }}-setup.exe.cdx.json
            build/accessweaver-0.1.1-alpha-windows-${{ matrix.arch }}-setup.exe
            build/accessweaver-0.1.1-alpha-windows-${{ matrix.arch }}-setup.exe.cdx.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain scoped public lifecycle result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-lifecycle-windows-${{ matrix.arch }}
          path: build/installer-lifecycle-checks/
          if-no-files-found: ignore
          retention-days: 14
