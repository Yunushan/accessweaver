name: Native Debian package lifecycle

on:
  push:
    branches: [main, 'codex/dns-adapter-coverage']
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'internal/workflow/presets/**'
      - 'internal/workflow/windows.ps1'
      - 'scripts/*linux*'
      - 'scripts/*release*'
      - 'scripts/build-all.sh'
      - 'scripts/sbom.py'
      - 'scripts/sbom/**'
      - 'scripts/sbom-tools/**'
      - '.github/workflows/linux-package-lifecycle.yml'
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'web/**'
      - 'internal/workflow/presets/**'
      - 'internal/workflow/windows.ps1'
      - 'scripts/*linux*'
      - 'scripts/*release*'
      - 'scripts/build-all.sh'
      - 'scripts/sbom.py'
      - 'scripts/sbom/**'
      - 'scripts/sbom-tools/**'
      - '.github/workflows/linux-package-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Native package lifecycle (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    concurrency:
      # New pushes must preserve the pending qualification of earlier revisions.
      group: linux-package-lifecycle-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    defaults:
      run:
        shell: bash
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      GO_VERSION: '1.27.4'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Ensure native package and signing tools are available
        run: |
          if ! command -v dpkg-scanpackages || ! command -v gpg || ! command -v gpgv || ! command -v ip || ! command -v openssl; then
            sudo apt-get -o APT::Update::Error-Mode=any update
            sudo apt-get install --no-install-recommends -y dpkg-dev gnupg gpgv iproute2 openssl
          fi
      - name: Verify reboot evidence rejects mismatched executables
        run: python3 -B scripts/test_linux_package_reboot.py
      - name: Build the exact source and exercise native dpkg and APT lifecycles
        run: |
          bash scripts/test-linux-package-candidate.sh "$TARGET_ARCH" "$GITHUB_SHA" "$RUNNER_TEMP/accessweaver-package-evidence"
      - name: Retain bounded architecture-specific qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package-lifecycle-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/accessweaver-package-evidence/dpkg.json
            ${{ runner.temp }}/accessweaver-package-evidence/apt.json
            ${{ runner.temp }}/accessweaver-package-evidence/qualification.json
          if-no-files-found: error
          retention-days: 14
