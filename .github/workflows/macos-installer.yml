name: Native macOS experimental package acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/macos_deployment.py
      - scripts/*macos*installer*
      - scripts/macos_package_archive.py
      - scripts/test_macos_package_archive.py
      - scripts/sbom.py
      - scripts/verify_release.py
      - scripts/verify_release_provenance.py
      - scripts/verify_release_rebuild.py
      - scripts/release_archive.py
      - scripts/sbom/**
      - cmd/accessweaver/**
      - cmd/accessweaver-installer/**
      - internal/**
      - web/**
      - LICENSE
      - README.md
      - README.tr.md
      - THIRD_PARTY.md
      - SECURITY.md
      - docs/MACOS_MANAGED_POLICY.md
      - docs/MANAGED_CONFIGURATION.md
      - docs/RELEASE_PROVENANCE.md
      - docs/AUDIT_EVENTS.md
      - go.mod
      - go.sum
      - .github/workflows/macos-installer.yml

permissions:
  contents: read

concurrency:
  group: macos-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Native package acceptance (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: amd64
          - os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }}
          cache: false
      - name: Native bundle/package contracts
        env:
          GOTOOLCHAIN: local
        run: |
          python3 -m unittest discover -s scripts -p test_macos_installer.py -v
          python3 -m unittest discover -s scripts -p test_macos_package_archive.py -v
          python3 -m unittest discover -s scripts -p test_macos_installer_provenance.py -v
          python3 -m unittest discover -s scripts -p test_sbom.py -v
      - name: Build and inspect actual unsigned native package without installation
        env:
          GOTOOLCHAIN: local
        run: python3 scripts/build-macos-installer.py --architecture '${{ matrix.arch }}' --version 0.1.0-alpha
      - name: Disposable clean installation and isolated app/receipt refusal
        env:
          ACCESSWEAVER_DISPOSABLE_MACOS_INSTALLER_TEST: '1'
          ACCESSWEAVER_MACOS_INSTALLER_ARCH: '${{ matrix.arch }}'
        run: python3 scripts/test-macos-installer-lifecycle.py
      - name: Attest package, inventories and native acceptance reports (attempt 1 of 2)
        id: provenance
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/macos-installer-checks/${{ matrix.arch }}/0.1.0-alpha/*
          create-storage-record: false
      - name: Retry failed attestation once (attempt 2 of 2)
        id: provenance_retry
        if: ${{ !cancelled() && steps.provenance.outcome == 'failure' }}
        timeout-minutes: 3
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/macos-installer-checks/${{ matrix.arch }}/0.1.0-alpha/*
          create-storage-record: false
      - name: Verify retained native package provenance and real rejection cases
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_DIRECTORY: build/macos-installer-checks/${{ matrix.arch }}/0.1.0-alpha
          PROVENANCE_REPORT: build/macos-installer-checks/${{ matrix.arch }}/native-provenance.json
          ATTESTATION_FIRST_OUTCOME: ${{ steps.provenance.outcome }}
          ATTESTATION_SECOND_OUTCOME: ${{ steps.provenance_retry.outcome }}
          ATTESTATION_FIRST_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          ATTESTATION_SECOND_BUNDLE: ${{ steps.provenance_retry.outputs.bundle-path }}
          PACKAGE_ARCH: '${{ matrix.arch }}'
        run: |
          case "$ATTESTATION_FIRST_OUTCOME:$ATTESTATION_SECOND_OUTCOME" in
            success:skipped) bundle="$ATTESTATION_FIRST_BUNDLE" ;;
            failure:success) bundle="$ATTESTATION_SECOND_BUNDLE" ;;
            *) echo "No successful attestation attempt" >&2; exit 1 ;;
          esac
          test -n "$bundle"
          cp "$bundle" "$PACKAGE_DIRECTORY/BUILD-PROVENANCE.sigstore.json"
          python3 scripts/verify_macos_installer_provenance.py "$PACKAGE_DIRECTORY" --source-commit "$GITHUB_SHA" --source-ref "$GITHUB_REF" --version 0.1.0-alpha --architecture "$PACKAGE_ARCH" --check-rejections > "$PROVENANCE_REPORT"
      - name: Retain actual package, SBOM and scoped compiler/inspection evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-installer-inspection-${{ matrix.arch }}
          path: build/macos-installer-checks/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 14
