name: Native Windows DoH round trip

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/dns-acceptance-state.ps1'
      - 'scripts/native-doh-scenario.ps1'
      - 'scripts/test-native-doh.ps1'
      - 'scripts/check-native-environment.cjs'
      - '.github/workflows/native-doh.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-doh-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  native:
    name: Native DoH (windows/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, os: windows-latest, sdkarch: x64}
          - {goarch: arm64, os: windows-11-arm, sdkarch: arm64}
    defaults:
      run:
        shell: pwsh
    env:
      ACCESSWEAVER_EXPECT_GOOS: windows
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: ${{ matrix.sdkarch }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.sdkarch }}
          package-manager-cache: false
      - name: Verify hosted native SDK and machine identity
        run: node scripts/check-native-environment.cjs
      - name: Verify coordinator source contracts before native changes
        run: |
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-dns-recovery-contracts.ps1 -RequireWindowsPowerShell
          if($LASTEXITCODE -ne 0){throw 'Native worker recovery source preflight failed'}
          & $stock -NoProfile -NonInteractive -File ./scripts/test-dns-acceptance-state.ps1 -RequireWindowsPowerShell
          if($LASTEXITCODE -ne 0){throw 'Native coordinator source preflight failed'}
      - name: Build the actual native controller
        run: |
          go build -trimpath -o build/native-doh/accessweaver.exe ./cmd/accessweaver
          if($LASTEXITCODE -ne 0){throw 'Native controller compilation failed'}
      - name: Verify source-built controller identity
        run: node scripts/check-native-environment.cjs --binary build/native-doh/accessweaver.exe
      - name: Native ordinary resolver and original-state restoration
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP ('accessweaver-native-doh-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $env:ACCESSWEAVER_NATIVE_DOH_EVIDENCE=$evidence
          "ACCESSWEAVER_NATIVE_DOH_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $binary=(Resolve-Path 'build/native-doh/accessweaver.exe').Path
          $digest=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-native-doh.ps1 -Binary $binary -BinarySHA256 $digest -ReportPath (Join-Path $evidence 'status.json')
          if($LASTEXITCODE -ne 0){throw 'Native DoH acceptance failed; fixed metadata retained'}
      - name: Retain fixed native DoH metadata only
        if: always() && env.ACCESSWEAVER_NATIVE_DOH_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-doh-windows-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_NATIVE_DOH_EVIDENCE }}/status.json
          if-no-files-found: error
          retention-days: 7
