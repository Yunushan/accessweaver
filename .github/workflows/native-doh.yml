name: Native Windows encrypted DNS round trips

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/dns-acceptance-state.ps1'
      - 'scripts/test-dns-recovery-contracts.ps1'
      - 'scripts/test-dns-acceptance-state.ps1'
      - 'scripts/native-doh-scenario.ps1'
      - 'scripts/test-native-doh.ps1'
      - 'scripts/check-native-environment.cjs'
      - '.github/workflows/native-doh.yml'
  workflow_dispatch:
    inputs:
      dnscrypt_roundtrip:
        description: Run only the two product DNSCrypt round-trip jobs
        type: boolean
        default: false
      dnscrypt_port_probe:
        description: Compare UDP port 53 on disposable Windows runners
        type: boolean
        default: false
      dnscrypt_engine_probe:
        description: Run the pinned DNSCrypt engine on loopback with offline fixture answers
        type: boolean
        default: false
      dnscrypt_service_probe:
        description: Run the offline qualification through the native AccessWeaver service host
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Keep qualification evidence for each source revision.
  group: native-doh-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
  queue: max

env:
  GO_VERSION: '1.27.4'
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  native:
    if: ${{ !inputs.dnscrypt_port_probe && !inputs.dnscrypt_engine_probe && !inputs.dnscrypt_service_probe }}
    name: Native DNS ${{ matrix.case.method }}/${{ matrix.case.scenario }} (windows/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
        case: >-
          ${{ fromJSON(inputs.dnscrypt_roundtrip && '[{"method":"dnscrypt","scenario":"roundtrip"}]' ||
          '[{"method":"doh","scenario":"roundtrip"},
          {"method":"doh","scenario":"journal-recovery"},
          {"method":"doh","scenario":"static-ipv6"},
          {"method":"dnscrypt","scenario":"roundtrip"},
          {"method":"dnscrypt","scenario":"remove-all"},
          {"method":"dnscrypt","scenario":"missing-snapshot"},
          {"method":"dnscrypt","scenario":"service-loss"},
          {"method":"dnscrypt","scenario":"service-reactivation"},
          {"method":"dnscrypt","scenario":"verification-failure"}]') }}
        include:
          - {goarch: amd64, os: windows-latest, sdkarch: x64}
          - {goarch: arm64, os: windows-11-arm, sdkarch: arm64}
    defaults:
      run:
        shell: pwsh
    env:
      ACCESSWEAVER_EXPECT_GOOS: windows
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: ${{ matrix.sdkarch }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.sdkarch }}
          package-manager-cache: false
      - name: Verify hosted native SDK and machine identity
        run: node scripts/check-native-environment.cjs
      - name: Verify coordinator source contracts before native changes
        run: |
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-dns-recovery-contracts.ps1 -RequireWindowsPowerShell
          if($LASTEXITCODE -ne 0){throw 'Native worker recovery source preflight failed'}
          & $stock -NoProfile -NonInteractive -File ./scripts/test-dns-acceptance-state.ps1 -RequireWindowsPowerShell
          if($LASTEXITCODE -ne 0){throw 'Native coordinator source preflight failed'}
      - name: Build the actual native controller
        run: |
          go build -trimpath -o build/native-doh/accessweaver.exe ./cmd/accessweaver
          if($LASTEXITCODE -ne 0){throw 'Native controller compilation failed'}
      - name: Verify source-built controller identity
        run: node scripts/check-native-environment.cjs --binary build/native-doh/accessweaver.exe
      - name: Native ordinary resolver and original-state restoration
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP ('accessweaver-native-doh-'+[Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $env:ACCESSWEAVER_NATIVE_DOH_EVIDENCE=$evidence
          "ACCESSWEAVER_NATIVE_DOH_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $binary=(Resolve-Path 'build/native-doh/accessweaver.exe').Path
          $digest=(Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $stock=Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          & $stock -NoProfile -NonInteractive -File ./scripts/test-native-doh.ps1 -Binary $binary -BinarySHA256 $digest -Method ${{ matrix.case.method }} -ScenarioKind ${{ matrix.case.scenario }} -ReportPath (Join-Path $evidence 'status.json')
          if($LASTEXITCODE -ne 0){throw 'Native encrypted DNS acceptance failed; fixed metadata retained'}
      - name: Retain fixed native DNS metadata only
        if: always() && env.ACCESSWEAVER_NATIVE_DOH_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dns-${{ matrix.case.method }}-${{ matrix.case.scenario }}-windows-${{ matrix.goarch }}
          path: ${{ env.ACCESSWEAVER_NATIVE_DOH_EVIDENCE }}/status.json
          if-no-files-found: error
          retention-days: 7

  dnscrypt-port:
    if: inputs.dnscrypt_port_probe || inputs.dnscrypt_engine_probe || inputs.dnscrypt_service_probe
    name: DNSCrypt UDP port probe (windows/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, runner: windows-latest}
          - {arch: arm64, runner: windows-11-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.dnscrypt_service_probe
        with:
          go-version: ${{ env.GO_VERSION }}
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: false
      - name: Build the native AccessWeaver service host
        if: inputs.dnscrypt_service_probe
        shell: pwsh
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference='Stop'
          go build -mod=readonly -trimpath -buildvcs=true -o build/native-dnscrypt-service/accessweaver.exe ./cmd/accessweaver
          if($LASTEXITCODE -ne 0){throw 'Native service controller build failed'}
          $identity=(& ./build/native-dnscrypt-service/accessweaver.exe version --json | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $identity.platform -cne 'windows' -or $identity.arch -cne $env:EXPECTED_ARCH -or
             $identity.goVersion -cne ('go'+$env:GO_VERSION) -or $identity.commit -cne $env:GITHUB_SHA -or $identity.sourceState -cne 'clean'){
            throw 'Native service controller build identity differs'
          }
      - name: Compare UDP listeners and exclusive loopback binding
        shell: powershell
        env:
          ACCESSWEAVER_DNSCRYPT_PORT_PROBE: '1'
          ACCESSWEAVER_DNSCRYPT_ENGINE_PROBE: ${{ inputs.dnscrypt_engine_probe || inputs.dnscrypt_service_probe }}
          ACCESSWEAVER_DNSCRYPT_SERVICE_PROBE: ${{ inputs.dnscrypt_service_probe }}
        run: |
          $ErrorActionPreference='Stop'
          $evidence=Join-Path $env:RUNNER_TEMP ('accessweaver-dnscrypt-port-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          "ACCESSWEAVER_DNSCRYPT_PORT_EVIDENCE=$evidence" >> $env:GITHUB_ENV
          $controller='';$digest=''
          if($env:ACCESSWEAVER_DNSCRYPT_SERVICE_PROBE -ceq 'true'){
            $controller=(Resolve-Path 'build/native-dnscrypt-service/accessweaver.exe').Path
            $digest=(Get-FileHash -LiteralPath $controller -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          ./scripts/test-native-dnscrypt-port.ps1 -ReportPath (Join-Path $evidence 'status.json') -TestEngine:($env:ACCESSWEAVER_DNSCRYPT_ENGINE_PROBE -ceq 'true') -ServiceController $controller -ControllerSHA256 $digest
      - name: Retain fixed port probe results
        if: always() && env.ACCESSWEAVER_DNSCRYPT_PORT_EVIDENCE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-dnscrypt-port-windows-${{ matrix.arch }}
          path: ${{ env.ACCESSWEAVER_DNSCRYPT_PORT_EVIDENCE }}/status.json
          if-no-files-found: error
          retention-days: 7
