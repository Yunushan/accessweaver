name: Windows owned process tree regression

on:
  push:
    branches: ['main', 'codex/dns-adapter-coverage']
    paths:
      - 'internal/nativeprocess/**'
      - 'scripts/windows-tree-fixed-report.cjs'
      - 'scripts/test-windows-tree-fixed-report.cjs'
      - '.github/workflows/windows-tree-regression.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: '0'

jobs:
  native:
    name: Owned process tree (windows/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: windows-latest, sdkarch: x64}
          - {arch: arm64, os: windows-11-arm, sdkarch: arm64}
    env:
      ACCESSWEAVER_EXPECT_GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.sdkarch }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.8.2'
          architecture: ${{ matrix.sdkarch }}
          package-manager-cache: false
      - name: Verify fixed stage projection
        run: node --test scripts/test-windows-tree-fixed-report.cjs
      - name: Repeat owned process tree test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP ('accessweaver-tree-report-'+[Guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $dir -ErrorAction Stop)
          "ACCESSWEAVER_TREE_REPORT_DIR=$dir" >> $env:GITHUB_ENV
          $env:ACCESSWEAVER_TREE_REPORT_DIR=$dir
          node scripts/windows-tree-fixed-report.cjs
          if($LASTEXITCODE -ne 0){throw 'Owned process tree repeat failed; fixed report retained'}
      - name: Retain fixed process-tree report
        if: always() && env.ACCESSWEAVER_TREE_REPORT_DIR != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tree-regression-${{ matrix.arch }}
          path: ${{ env.ACCESSWEAVER_TREE_REPORT_DIR }}/status.json
          if-no-files-found: error
          retention-days: 7
