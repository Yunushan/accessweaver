name: Bug report
description: Report a reproducible AccessWeaver problem.
body:
- type: markdown
  attributes:
    value: >-
      Keep vulnerability details and sensitive evidence out of public issues. Review the
      support policy before sharing. Omit profiles, raw logs, credentials, private addresses
      and command arguments from reports and attachments.
      [Security reporting](https://github.com/Yunushan/accessweaver/blob/main/SECURITY.md) and
      [Support policy](https://github.com/Yunushan/accessweaver/blob/main/docs/SUPPORT_POLICY.md).
- type: dropdown
  id: impact
  attributes:
    label: Impact
    description: Describe the impact; a maintainer confirms severity during triage. No response deadline
      is promised.
    options:
    - Unsafe operation, data loss, or recovery unavailable
    - Feature unavailable; no safe workaround
    - Feature degraded; safe workaround available
    - Minor issue or question
  validations:
    required: true
- type: textarea
  id: behavior
  attributes:
    label: What happened?
    description: Describe expected and observed behavior. Include a fixed failure code if available; omit
      raw error output and private data.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Give reproducible steps using synthetic examples. Do not attach real profiles, logs or
      command arguments.
  validations:
    required: true
- type: input
  id: platform
  attributes:
    label: OS version and architecture
    placeholder: Windows 11 arm64
  validations:
    required: true
- type: input
  id: build
  attributes:
    label: AccessWeaver version and commit
    description: >-
      Copy only the version and commit from existing build metadata or trusted endpoint inventory.
      Enter unknown for any value you cannot verify.
    placeholder: 0.1.0-alpha, commit unknown
  validations:
    required: true
- type: textarea
  id: engine
  attributes:
    label: External engine and evidence
    description: Known engine name/version, operating mode and privilege level, plus how routing was independently
      checked. Omit command lines and private evidence; leave blank for UI-only issues.
- type: checkboxes
  id: public_evidence
  attributes:
    label: Public evidence review
    options:
    - label: I reviewed this report and any attachments and removed secrets, profile contents, account/device
        names, private addresses, paths, command arguments and raw logs.
      required: true
